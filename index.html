<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Golf Trip Live Scoring</title>

  <!-- Tailwind CSS, React, and Babel Standalone (Zero-Build CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    body {
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .safe-top {
      padding-top: max(0.5rem, var(--sat));
    }
    .safe-bottom {
      padding-bottom: max(0.5rem, var(--sab));
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 overflow-hidden font-sans select-none antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const STORAGE_KEY_ROUND = 'GOLF_TRIP_ACTIVE_ROUND_V9';
    const STORAGE_KEY_COURSES = 'GOLF_TRIP_SAVED_COURSES_V9';
    const STORAGE_KEY_ROSTER = 'GOLF_TRIP_SAVED_ROSTER_V9';

    const DEFAULT_COURSES = [
      {
        id: 'pinehurst',
        name: "Pinehurst No. 2",
        holesCount: 18,
        holes: [
          { num: 1, par: 4, hcp: 8, yardage: 404 },
          { num: 2, par: 4, hcp: 4, yardage: 507 },
          { num: 3, par: 4, hcp: 14, yardage: 387 },
          { num: 4, par: 5, hcp: 6, yardage: 569 },
          { num: 5, par: 4, hcp: 2, yardage: 472 },
          { num: 6, par: 3, hcp: 12, yardage: 228 },
          { num: 7, par: 4, hcp: 16, yardage: 424 },
          { num: 8, par: 4, hcp: 10, yardage: 502 },
          { num: 9, par: 3, hcp: 18, yardage: 191 },
          { num: 10, par: 5, hcp: 5, yardage: 617 },
          { num: 11, par: 4, hcp: 7, yardage: 483 },
          { num: 12, par: 4, hcp: 13, yardage: 456 },
          { num: 13, par: 4, hcp: 15, yardage: 382 },
          { num: 14, par: 4, hcp: 3, yardage: 473 },
          { num: 15, par: 3, hcp: 17, yardage: 202 },
          { num: 16, par: 5, hcp: 9, yardage: 534 },
          { num: 17, par: 3, hcp: 11, yardage: 205 },
          { num: 18, par: 4, hcp: 1, yardage: 451 }
        ]
      },
      {
        id: 'pebble',
        name: "Pebble Beach Golf Links",
        holesCount: 18,
        holes: [
          { num: 1, par: 4, hcp: 8, yardage: 377 },
          { num: 2, par: 5, hcp: 10, yardage: 502 },
          { num: 3, par: 4, hcp: 12, yardage: 390 },
          { num: 4, par: 4, hcp: 16, yardage: 326 },
          { num: 5, par: 3, hcp: 14, yardage: 192 },
          { num: 6, par: 5, hcp: 2, yardage: 506 },
          { num: 7, par: 3, hcp: 18, yardage: 106 },
          { num: 8, par: 4, hcp: 6, yardage: 427 },
          { num: 9, par: 4, hcp: 4, yardage: 481 },
          { num: 10, par: 4, hcp: 7, yardage: 446 },
          { num: 11, par: 4, hcp: 5, yardage: 373 },
          { num: 12, par: 3, hcp: 17, yardage: 201 },
          { num: 13, par: 4, hcp: 9, yardage: 403 },
          { num: 14, par: 5, hcp: 1, yardage: 572 },
          { num: 15, par: 4, hcp: 13, yardage: 396 },
          { num: 16, par: 4, hcp: 11, yardage: 401 },
          { num: 17, par: 3, hcp: 15, yardage: 178 },
          { num: 18, par: 5, hcp: 3, yardage: 543 }
        ]
      },
      {
        id: 'executive9',
        name: "Cypress Dunes (9-Hole Exec)",
        holesCount: 9,
        holes: [
          { num: 1, par: 4, hcp: 3, yardage: 335 },
          { num: 2, par: 3, hcp: 7, yardage: 150 },
          { num: 3, par: 4, hcp: 1, yardage: 385 },
          { num: 4, par: 5, hcp: 5, yardage: 490 },
          { num: 5, par: 3, hcp: 9, yardage: 165 },
          { num: 6, par: 4, hcp: 2, yardage: 360 },
          { num: 7, par: 4, hcp: 6, yardage: 340 },
          { num: 8, par: 3, hcp: 8, yardage: 140 },
          { num: 9, par: 5, hcp: 4, yardage: 510 }
        ]
      }
    ];

    const DEFAULT_SAVED_PLAYERS = [
      { id: 'sp1', name: 'Alex M.', hcp: 8, color: '#10B981' },
      { id: 'sp2', name: 'Jake T.', hcp: 14, color: '#3B82F6' },
      { id: 'sp3', name: 'Ryan C.', hcp: 10, color: '#F59E0B' },
      { id: 'sp4', name: 'Dave K.', hcp: 18, color: '#EC4899' },
      { id: 'sp5', name: 'Chris B.', hcp: 12, color: '#8B5CF6' },
      { id: 'sp6', name: 'Matt S.', hcp: 6, color: '#14B8A6' }
    ];

    const GAME_TYPES = [
      { id: 'best_ball', name: 'Best Ball (Four-Ball)', short: 'Best Ball', desc: 'Lowest gross/net ball on each hole counts for the team score.' },
      { id: 'scramble', name: 'Scramble', short: 'Scramble', desc: 'All players hit, pick best shot, all play from there until holed.' },
      { id: 'vegas', name: 'Vegas (High-Low)', short: 'Vegas', desc: 'Teammates combine scores (e.g. 4 & 5 make 45). Birdie flips opponent score!' },
      { id: 'skins', name: 'Skins with Carryovers', short: 'Skins', desc: 'Lowest unique score wins the skin. Ties carry over to next hole.' },
      { id: 'wolf', name: 'Wolf (Rotating Captain)', short: 'Wolf', desc: 'Player has honor, watches drives, selects partner or goes Lone Wolf.' },
      { id: 'stableford', name: 'Stableford Points', short: 'Stableford', desc: 'Points per hole: Dbl Bogey=0, Bogey=1, Par=2, Birdie=3, Eagle=4, Albatross=5.' },
      { id: 'nassau', name: 'Nassau (2-2-2)', short: 'Nassau', desc: 'Three separate matches in one: Front 9 winner, Back 9 winner, and Overall 18.' },
      { id: 'shamble', name: 'Shamble', short: 'Shamble', desc: 'Best drive chosen, each player plays own ball into cup from there.' },
      { id: 'match_play', name: 'Match Play', short: 'Match Play', desc: 'Hole-by-hole competition. Winning a hole earns 1 point.' },
      { id: 'quota', name: 'Quota (Chicago)', short: 'Quota', desc: 'Points scored against target quota (Quota = 36 - Handicap).' }
    ];

    const COLOR_PALETTE = ['#10B981', '#3B82F6', '#F59E0B', '#EC4899', '#8B5CF6', '#14B8A6', '#EF4444', '#06B6D4'];

    function safeLoadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw) return JSON.parse(raw);
      } catch (e) {
        console.error("Local load failed for " + key, e);
      }
      return fallback;
    }

    function App() {
      const isInitialMount = useRef(true);

      // Access Mode (Scorer vs Spectator)
      const [accessMode, setAccessMode] = useState(() => {
        try {
          const hash = window.location.hash;
          if (hash.includes('mode=readonly') || hash.includes('mode=ro')) return 'ro';
        } catch (e) {}
        return 'rw';
      });

      const [activeTab, setActiveTab] = useState('live');
      const [toastMessage, setToastMessage] = useState('');

      // PERMANENT LIBRARIES (Courses & Saved Golfers)
      const [savedCourses, setSavedCourses] = useState(() => safeLoadJSON(STORAGE_KEY_COURSES, DEFAULT_COURSES));
      const [savedRoster, setSavedRoster] = useState(() => safeLoadJSON(STORAGE_KEY_ROSTER, DEFAULT_SAVED_PLAYERS));

      // ACTIVE TOURNAMENT ROUND STATE
      const savedRound = safeLoadJSON(STORAGE_KEY_ROUND, null);

      const [courseName, setCourseName] = useState(() => savedRound?.courseName || 'Pinehurst No. 2');
      const [roundDate, setRoundDate] = useState(() => savedRound?.roundDate || new Date().toISOString().split('T')[0]);
      const [holesCount, setHolesCount] = useState(() => savedRound?.holesCount || 18);
      const [holes, setHoles] = useState(() => savedRound?.holes || DEFAULT_COURSES[0].holes);
      
      const [players, setPlayers] = useState(() => savedRound?.players || [
        { id: 'p1', name: 'Alex M.', hcp: 8, team: 'A', color: '#10B981' },
        { id: 'p2', name: 'Jake T.', hcp: 14, team: 'A', color: '#3B82F6' },
        { id: 'p3', name: 'Ryan C.', hcp: 10, team: 'B', color: '#F59E0B' },
        { id: 'p4', name: 'Dave K.', hcp: 18, team: 'B', color: '#EC4899' },
      ]);

      const [teams, setTeams] = useState(() => savedRound?.teams || [
        { id: 'A', name: 'Team Eagles' },
        { id: 'B', name: 'Team Birdies' }
      ]);

      const [activeGame, setActiveGame] = useState(() => savedRound?.activeGame || 'best_ball');
      const [pointsWager, setPointsWager] = useState(() => savedRound?.pointsWager || 10);

      const [scores, setScores] = useState(() => {
        if (savedRound?.scores && Object.keys(savedRound.scores).length > 0) return savedRound.scores;
        const initial = {};
        for (let i = 1; i <= 18; i++) initial[i] = { p1: null, p2: null, p3: null, p4: null };
        return initial;
      });

      const [currentHole, setCurrentHole] = useState(() => savedRound?.currentHole || 1);
      const [selectedPlayerId, setSelectedPlayerId] = useState('p1');
      const [sheetsWebhookUrl, setSheetsWebhookUrl] = useState(() => savedRound?.sheetsWebhookUrl || '');
      const [isSyncing, setIsSyncing] = useState(false);
      const [showOtherModal, setShowOtherModal] = useState(false);
      const [manualScoreInput, setManualScoreInput] = useState('');
      const [showRosterPickerModal, setShowRosterPickerModal] = useState(false);

      // Save Courses Library permanently whenever it changes
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY_COURSES, JSON.stringify(savedCourses));
        } catch (e) {}
      }, [savedCourses]);

      // Save Golfer Roster permanently whenever it changes
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY_ROSTER, JSON.stringify(savedRoster));
        } catch (e) {}
      }, [savedRoster]);

      // Save Active Round persistently
      useEffect(() => {
        if (isInitialMount.current) {
          isInitialMount.current = false;
          return;
        }

        if (accessMode === 'rw') {
          try {
            const payload = {
              courseName,
              roundDate,
              holesCount,
              holes,
              players,
              teams,
              activeGame,
              pointsWager,
              scores,
              currentHole,
              sheetsWebhookUrl
            };
            localStorage.setItem(STORAGE_KEY_ROUND, JSON.stringify(payload));
          } catch (e) {}
        }
      }, [courseName, roundDate, holesCount, holes, players, teams, activeGame, pointsWager, scores, currentHole, sheetsWebhookUrl, accessMode]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      // COURSE LIBRARY ACTIONS
      const handleSaveCurrentCourseToLibrary = () => {
        const courseId = `c_${Date.now()}`;
        const newCourseEntry = {
          id: courseId,
          name: courseName.trim() || 'Custom Course',
          holesCount: Number(holesCount),
          holes: JSON.parse(JSON.stringify(holes.slice(0, holesCount)))
        };

        setSavedCourses(prev => {
          const filtered = prev.filter(c => c.name.toLowerCase() !== newCourseEntry.name.toLowerCase());
          return [newCourseEntry, ...filtered];
        });
        showToast(`Saved "${newCourseEntry.name}" to Course Library!`);
      };

      const handleLoadCourseFromLibrary = (courseObj) => {
        if (accessMode === 'ro') return;
        setCourseName(courseObj.name);
        setHolesCount(courseObj.holesCount);
        setHoles(JSON.parse(JSON.stringify(courseObj.holes)));
        
        // Reset scores matrix safely for new course layout
        const newScores = {};
        for (let i = 1; i <= courseObj.holesCount; i++) {
          newScores[i] = {};
          players.forEach(p => { newScores[i][p.id] = null; });
        }
        setScores(newScores);
        setCurrentHole(1);
        showToast(`Loaded "${courseObj.name}"!`);
      };

      const handleDeleteCourseFromLibrary = (id, name) => {
        if (confirm(`Remove "${name}" from your course library?`)) {
          setSavedCourses(prev => prev.filter(c => c.id !== id));
          showToast(`Removed "${name}" from library.`);
        }
      };

      // GOLFER ROSTER LIBRARY ACTIONS
      const handleSaveCurrentPlayersToRoster = () => {
        setSavedRoster(prev => {
          const rosterMap = new Map(prev.map(p => [p.name.toLowerCase(), p]));
          players.forEach(p => {
            rosterMap.set(p.name.toLowerCase(), {
              id: p.id.startsWith('sp') ? p.id : `sp_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`,
              name: p.name.trim(),
              hcp: Number(p.hcp) || 0,
              color: p.color
            });
          });
          return Array.from(rosterMap.values());
        });
        showToast('Saved all active players to Trip Roster!');
      };

      const handleAddPlayerFromSavedRoster = (savedPlayer) => {
        if (players.some(p => p.name.toLowerCase() === savedPlayer.name.toLowerCase())) {
          showToast(`${savedPlayer.name} is already in the round!`);
          return;
        }
        const newPlayerInstance = {
          id: `p_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`,
          name: savedPlayer.name,
          hcp: Number(savedPlayer.hcp) || 0,
          team: players.length % 2 === 0 ? 'A' : 'B',
          color: savedPlayer.color || COLOR_PALETTE[players.length % COLOR_PALETTE.length]
        };
        setPlayers(prev => [...prev, newPlayerInstance]);
        showToast(`Added ${savedPlayer.name} to Round!`);
      };

      const handleDeletePlayerFromRoster = (id, name) => {
        setSavedRoster(prev => prev.filter(p => p.id !== id));
        showToast(`Removed ${name} from saved roster.`);
      };

      const getPlayerHoleStrokes = (playerHcp, holeHcpIndex) => {
        if (!playerHcp || playerHcp <= 0) return 0;
        const baseStrokes = Math.floor(playerHcp / holesCount);
        const remainder = playerHcp % holesCount;
        return baseStrokes + (holeHcpIndex <= remainder ? 1 : 0);
      };

      const currentHoleData = useMemo(() => {
        return holes.find(h => h.num === currentHole) || { num: currentHole, par: 4, hcp: 1, yardage: 400 };
      }, [holes, currentHole]);

      const handleSetScore = (holeNum, playerId, scoreValue) => {
        if (accessMode === 'ro') {
          showToast('Spectator mode: Scoring locked');
          return;
        }
        const val = scoreValue === null || scoreValue === undefined ? null : Number(scoreValue);
        setScores(prev => ({
          ...prev,
          [holeNum]: { ...(prev[holeNum] || {}), [playerId]: val }
        }));
      };

      const advanceToNext = () => {
        const playerIdx = players.findIndex(p => p.id === selectedPlayerId);
        if (playerIdx < players.length - 1) {
          setSelectedPlayerId(players[playerIdx + 1].id);
        } else {
          if (currentHole < holesCount) {
            setCurrentHole(prev => prev + 1);
            setSelectedPlayerId(players[0].id);
          }
        }
      };

      const handleAddBlankPlayer = () => {
        if (accessMode === 'ro') return;
        const newId = `p_${Date.now()}`;
        const color = COLOR_PALETTE[players.length % COLOR_PALETTE.length];
        setPlayers(prev => [
          ...prev,
          { id: newId, name: `Player ${prev.length + 1}`, hcp: 10, team: prev.length % 2 === 0 ? 'A' : 'B', color }
        ]);
        showToast('Added golfer slot');
      };

      const handleDeleteActivePlayer = (id) => {
        if (accessMode === 'ro') return;
        if (players.length <= 1) {
          showToast('Must keep at least 1 player');
          return;
        }
        setPlayers(prev => prev.filter(p => p.id !== id));
      };

      const handleUpdatePlayer = (id, field, value) => {
        if (accessMode === 'ro') return;
        setPlayers(prev => prev.map(p => p.id === id ? { ...p, [field]: value } : p));
      };

      const handleUpdateHole = (holeNum, field, val) => {
        if (accessMode === 'ro') return;
        setHoles(prev => prev.map(h => h.num === holeNum ? { ...h, [field]: Number(val) || val } : h));
      };

      const handleManualReset = () => {
        if (confirm("Reset active round scores? (Your saved courses & golfer profiles remain safe)")) {
          const freshScores = {};
          for (let i = 1; i <= holesCount; i++) freshScores[i] = {};
          setScores(freshScores);
          setCurrentHole(1);
          showToast('Round scores reset!');
        }
      };

      // Player Metrics
      const playerStats = useMemo(() => {
        return players.map(player => {
          let totalGross = 0, totalNet = 0, totalPar = 0, holesPlayed = 0, stablefordPoints = 0, skinsWon = 0;
          
          holes.slice(0, holesCount).forEach(h => {
            const gross = scores[h.num]?.[player.id];
            if (gross !== null && gross !== undefined && gross > 0) {
              holesPlayed++;
              totalGross += Number(gross);
              totalPar += h.par;
              const strokes = getPlayerHoleStrokes(player.hcp, h.hcp);
              const net = Number(gross) - strokes;
              totalNet += net;

              const netDiff = net - h.par;
              if (netDiff <= -3) stablefordPoints += 5;
              else if (netDiff === -2) stablefordPoints += 4;
              else if (netDiff === -1) stablefordPoints += 3;
              else if (netDiff === 0) stablefordPoints += 2;
              else if (netDiff === 1) stablefordPoints += 1;
            }
          });

          holes.slice(0, holesCount).forEach(h => {
            const allHoleScores = players.map(p => {
              const raw = scores[h.num]?.[p.id];
              return raw ? raw - getPlayerHoleStrokes(p.hcp, h.hcp) : null;
            }).filter(s => s !== null);

            if (allHoleScores.length === players.length && players.length > 0) {
              const myRaw = scores[h.num]?.[player.id];
              if (myRaw) {
                const myNet = myRaw - getPlayerHoleStrokes(player.hcp, h.hcp);
                const minNet = Math.min(...allHoleScores);
                if (myNet === minNet && allHoleScores.filter(s => s === minNet).length === 1) {
                  skinsWon++;
                }
              }
            }
          });

          const scoreToPar = totalGross - totalPar;
          const netToPar = totalNet - totalPar;
          const quotaTarget = Math.max(1, 36 - player.hcp);
          const quotaDiff = stablefordPoints - (holesPlayed / holesCount * quotaTarget);

          return {
            ...player,
            holesPlayed,
            totalGross,
            totalNet,
            scoreToPar: holesPlayed > 0 ? (scoreToPar > 0 ? `+${scoreToPar}` : scoreToPar === 0 ? 'E' : `${scoreToPar}`) : '-',
            netToPar: holesPlayed > 0 ? (netToPar > 0 ? `+${netToPar}` : netToPar === 0 ? 'E' : `${netToPar}`) : '-',
            rawScoreToPar: scoreToPar,
            rawNetToPar: netToPar,
            stablefordPoints,
            quotaTarget,
            quotaDiff: (quotaDiff >= 0 ? `+${quotaDiff.toFixed(1)}` : quotaDiff.toFixed(1)),
            rawQuotaDiff: quotaDiff,
            skinsWon
          };
        });
      }, [players, holes, holesCount, scores]);

      // Game Engine Calculations
      const gameEngine = useMemo(() => {
        const teamA = playerStats.filter(p => p.team === 'A');
        const teamB = playerStats.filter(p => p.team === 'B');

        let teamANet = 0, teamBNet = 0, teamAGross = 0, teamBGross = 0, teamAHoles = 0, teamBHoles = 0;
        holes.slice(0, holesCount).forEach(h => {
          const sANet = teamA.map(p => scores[h.num]?.[p.id] ? scores[h.num][p.id] - getPlayerHoleStrokes(p.hcp, h.hcp) : null).filter(s => s !== null);
          const sBNet = teamB.map(p => scores[h.num]?.[p.id] ? scores[h.num][p.id] - getPlayerHoleStrokes(p.hcp, h.hcp) : null).filter(s => s !== null);
          const sAGross = teamA.map(p => scores[h.num]?.[p.id]).filter(s => s !== null);
          const sBGross = teamB.map(p => scores[h.num]?.[p.id]).filter(s => s !== null);

          if (sANet.length > 0) { teamANet += Math.min(...sANet); teamAHoles++; }
          if (sBNet.length > 0) { teamBNet += Math.min(...sBNet); teamBHoles++; }
          if (sAGross.length > 0) teamAGross += Math.min(...sAGross);
          if (sBGross.length > 0) teamBGross += Math.min(...sBGross);
        });

        let vegasTeamA = 0, vegasTeamB = 0;
        holes.slice(0, holesCount).forEach(h => {
          const sA1 = scores[h.num]?.[teamA[0]?.id];
          const sA2 = scores[h.num]?.[teamA[1]?.id];
          const sB1 = scores[h.num]?.[teamB[0]?.id];
          const sB2 = scores[h.num]?.[teamB[1]?.id];

          if (sA1 && sA2 && sB1 && sB2) {
            let aLow = Math.min(sA1, sA2), aHigh = Math.max(sA1, sA2);
            let bLow = Math.min(sB1, sB2), bHigh = Math.max(sB1, sB2);
            let valA = parseInt(`${aLow}${aHigh}`, 10);
            let valB = parseInt(`${bLow}${bHigh}`, 10);

            if (aLow < h.par && bLow >= h.par) valB = parseInt(`${bHigh}${bLow}`, 10);
            else if (bLow < h.par && aLow >= h.par) valA = parseInt(`${aHigh}${aLow}`, 10);

            const diff = valB - valA;
            if (diff > 0) vegasTeamA += diff;
            else if (diff < 0) vegasTeamB += Math.abs(diff);
          }
        });

        const skinsData = [];
        let carryover = 0;
        holes.slice(0, holesCount).forEach(h => {
          const holeScores = players.map(p => {
            const raw = scores[h.num]?.[p.id];
            return raw ? { player: p, net: raw - getPlayerHoleStrokes(p.hcp, h.hcp) } : null;
          }).filter(Boolean);

          let winner = null;
          let skinValue = 1 + carryover;
          if (holeScores.length === players.length && players.length > 0) {
            const minNet = Math.min(...holeScores.map(s => s.net));
            const winners = holeScores.filter(s => s.net === minNet);
            if (winners.length === 1) {
              winner = winners[0].player;
              carryover = 0;
            } else {
              carryover += 1;
            }
          }
          skinsData.push({ hole: h.num, par: h.par, skinValue, winner, carryover: winner ? 0 : carryover });
        });

        let front9A = 0, front9B = 0, back9A = 0, back9B = 0, total18A = 0, total18B = 0;
        holes.slice(0, holesCount).forEach(h => {
          const sANet = teamA.map(p => scores[h.num]?.[p.id] ? scores[h.num][p.id] - getPlayerHoleStrokes(p.hcp, h.hcp) : 999);
          const sBNet = teamB.map(p => scores[h.num]?.[p.id] ? scores[h.num][p.id] - getPlayerHoleStrokes(p.hcp, h.hcp) : 999);
          const minA = Math.min(...sANet);
          const minB = Math.min(...sBNet);
          if (minA !== 999 && minB !== 999) {
            if (minA < minB) {
              if (h.num <= 9) front9A++; else back9A++;
              total18A++;
            } else if (minB < minA) {
              if (h.num <= 9) front9B++; else back9B++;
              total18B++;
            }
          }
        });

        return {
          bestBall: { teamANet, teamBNet, teamAGross, teamBGross, teamAHoles, teamBHoles },
          vegas: { vegasTeamA, vegasTeamB, diff: vegasTeamA - vegasTeamB },
          skins: { skinsData, currentCarryover: skinsData[skinsData.length - 1]?.carryover || 0 },
          nassau: { front9A, front9B, back9A, back9B, total18A, total18B }
        };

        if (diff <= -2) return <span className="inline-flex items-center justify-center w-6 h-6 rounded-full bg-amber-200 text-amber-950 border-2 border-amber-500 ring-1 ring-amber-400 font-black text-[11px] leading-none">{gross}</span>;

        if (diff === 0) return <span className="inline-flex items-center justify-center w-6 h-6 text-gray-100 font-bold text-[11px] leading-none">{gross}</span>;
        if (diff === 1) return <span className="inline-flex items-center justify-center w-5 h-5 bg-orange-200 text-orange-950 border border-orange-500 font-black text-[11px] leading-none">{gross}</span>;
        return <span className="inline-flex items-center justify-center w-5 h-5 bg-red-200 text-red-950 border border-red-600 ring-1 ring-red-400 font-black text-[11px] leading-none">{gross}</span>;

            timestamp: new Date().toISOString(),
            courseName,
            roundDate,
            activeGame,
            players,
            scores,
            holes: holes.slice(0, holesCount)

          await fetch(sheetsWebhookUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          showToast('Scores sent to Google Sheet!');

          showToast('Network error syncing to Google Sheets');

          setIsSyncing(false);
