<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#020617" />
  <title>Golf Trip Live Scoring</title>

  <!-- Production CDNs: Tailwind, React 18, ReactDOM 18 & Babel Standalone -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    body {
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }
    .safe-top {
      padding-top: max(0.5rem, var(--sat));
    }
    .safe-bottom {
      padding-bottom: max(0.5rem, var(--sab));
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 overflow-hidden font-sans antialiased">
  <div id="root">
    <div class="h-screen w-full flex items-center justify-center bg-slate-950 text-slate-400 text-sm font-semibold">
      Loading Golf Trip Hub...
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    const DEFAULT_SHEETS_URL = 'https://script.google.com/macros/s/AKfycbxZFxZ9Dc93Wo3jnccO_Te-6t1jrrsv6WwxLZkuT5XCIOfSpeQCDqjfwo-KK6Nl0qxffQ/exec';
    const STORAGE_KEY_ROUND = 'GOLF_TRIP_ACTIVE_ROUND_STABLE_V3';
    const STORAGE_KEY_COURSES = 'GOLF_TRIP_COURSES_LIB_STABLE_V3';
    const STORAGE_KEY_ROSTER = 'GOLF_TRIP_ROSTER_LIB_STABLE_V3';

    const DEFAULT_COURSES = [
      {
        id: 'pinehurst_2',
        name: "Pinehurst No. 2",
        holesCount: 18,
        holes: [
          { num: 1, par: 4, hcp: 8, yardage: 404 },
          { num: 2, par: 4, hcp: 4, yardage: 507 },
          { num: 3, par: 4, hcp: 14, yardage: 387 },
          { num: 4, par: 5, hcp: 6, yardage: 569 },
          { num: 5, par: 4, hcp: 2, yardage: 472 },
          { num: 6, par: 3, hcp: 12, yardage: 228 },
          { num: 7, par: 4, hcp: 16, yardage: 424 },
          { num: 8, par: 4, hcp: 10, yardage: 502 },
          { num: 9, par: 3, hcp: 18, yardage: 191 },
          { num: 10, par: 5, hcp: 5, yardage: 617 },
          { num: 11, par: 4, hcp: 7, yardage: 483 },
          { num: 12, par: 4, hcp: 13, yardage: 456 },
          { num: 13, par: 4, hcp: 15, yardage: 382 },
          { num: 14, par: 4, hcp: 3, yardage: 473 },
          { num: 15, par: 3, hcp: 17, yardage: 202 },
          { num: 16, par: 5, hcp: 9, yardage: 534 },
          { num: 17, par: 3, hcp: 11, yardage: 205 },
          { num: 18, par: 4, hcp: 1, yardage: 451 }
        ]
      },
      {
        id: 'pebble_beach',
        name: "Pebble Beach",
        holesCount: 18,
        holes: [
          { num: 1, par: 4, hcp: 8, yardage: 377 },
          { num: 2, par: 5, hcp: 10, yardage: 502 },
          { num: 3, par: 4, hcp: 12, yardage: 390 },
          { num: 4, par: 4, hcp: 16, yardage: 326 },
          { num: 5, par: 3, hcp: 14, yardage: 192 },
          { num: 6, par: 5, hcp: 2, yardage: 506 },
          { num: 7, par: 3, hcp: 18, yardage: 106 },
          { num: 8, par: 4, hcp: 6, yardage: 427 },
          { num: 9, par: 4, hcp: 4, yardage: 481 },
          { num: 10, par: 4, hcp: 7, yardage: 446 },
          { num: 11, par: 4, hcp: 5, yardage: 373 },
          { num: 12, par: 3, hcp: 17, yardage: 201 },
          { num: 13, par: 4, hcp: 9, yardage: 403 },
          { num: 14, par: 5, hcp: 1, yardage: 572 },
          { num: 15, par: 4, hcp: 13, yardage: 396 },
          { num: 16, par: 4, hcp: 11, yardage: 401 },
          { num: 17, par: 3, hcp: 15, yardage: 178 },
          { num: 18, par: 5, hcp: 3, yardage: 543 }
        ]
      },
      {
        id: 'cypress_exec',
        name: "Cypress Dunes (9H Exec)",
        holesCount: 9,
        holes: [
          { num: 1, par: 4, hcp: 3, yardage: 335 },
          { num: 2, par: 3, hcp: 7, yardage: 150 },
          { num: 3, par: 4, hcp: 1, yardage: 385 },
          { num: 4, par: 5, hcp: 5, yardage: 490 },
          { num: 5, par: 3, hcp: 9, yardage: 165 },
          { num: 6, par: 4, hcp: 2, yardage: 360 },
          { num: 7, par: 4, hcp: 6, yardage: 340 },
          { num: 8, par: 3, hcp: 8, yardage: 140 },
          { num: 9, par: 5, hcp: 4, yardage: 510 }
        ]
      }
    ];

    const DEFAULT_PLAYERS = [
      { id: 'p1', name: 'Alex M.', hcp: 8, team: 'A', color: '#10B981' },
      { id: 'p2', name: 'Jake T.', hcp: 14, team: 'A', color: '#3B82F6' },
      { id: 'p3', name: 'Ryan C.', hcp: 10, team: 'B', color: '#F59E0B' },
      { id: 'p4', name: 'Dave K.', hcp: 18, team: 'B', color: '#EC4899' }
    ];

    const GAME_TYPES = [
      { id: 'best_ball', name: 'Best Ball (Four-Ball)', desc: 'Lowest net score among teammates counts for the team on each hole.' },
      { id: 'scramble', name: 'Scramble', desc: 'All golfers tee off, best shot chosen, all play from that spot until holed.' },
      { id: 'vegas', name: 'Vegas (High-Low)', desc: 'Teammates combine scores (e.g., 4 & 5 make 45). Birdie inverts opponent score!' },
      { id: 'skins', name: 'Skins with Carryovers', desc: 'Lowest unique net score wins hole skin. Ties carry over to next hole.' },
      { id: 'wolf', name: 'Wolf (Rotating Captain)', desc: 'Honor player tees off, chooses partner or goes Lone Wolf.' },
      { id: 'stableford', name: 'Stableford Points', desc: 'Points per hole: Dbl Bogey=0, Bogey=1, Par=2, Birdie=3, Eagle=4, Albatross=5.' },
      { id: 'nassau', name: 'Nassau (2-2-2)', desc: 'Three separate matches: Front 9 winner, Back 9 winner, and Total 18 winner.' },
      { id: 'shamble', name: 'Shamble', desc: 'Best drive chosen, all players hit own ball into cup from there.' },
      { id: 'match_play', name: 'Match Play', desc: 'Hole-by-hole competition. Winning a hole earns 1 point. Up/Down tracker.' },
      { id: 'quota', name: 'Quota (Chicago)', desc: 'Points scored against target handicap quota (Quota = 36 - Handicap).' }
    ];

    const COLOR_PALETTE = ['#10B981', '#3B82F6', '#F59E0B', '#EC4899', '#8B5CF6', '#14B8A6', '#EF4444', '#06B6D4'];

    function safeLoadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw) return JSON.parse(raw);
      } catch (e) {
        console.warn("Storage load error for " + key, e);
      }
      return fallback;
    }

    function safeSaveJSON(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {
        console.warn("Storage save error for " + key, e);
      }
    }

    function getStrokesGiven(playerHcp, holeHcpIndex, totalHoles) {
      if (!playerHcp || playerHcp <= 0) return 0;
      const count = totalHoles || 18;
      const base = Math.floor(playerHcp / count);
      const remainder = playerHcp % count;
      return base + (holeHcpIndex <= remainder ? 1 : 0);
    }

    function App() {
      let initialImport = null;
      let initialMode = 'rw';
      let initialTrip = 'GolfTrip2026';
      let initialApi = DEFAULT_SHEETS_URL;

      try {
        if (window.location.hash) {
          const hashClean = window.location.hash.replace(/^#/, '');
          const params = new URLSearchParams(hashClean);
          if (params.get('mode') === 'readonly' || params.get('mode') === 'ro') initialMode = 'ro';
          if (params.get('trip')) initialTrip = params.get('trip');
          if (params.get('api')) initialApi = decodeURIComponent(params.get('api'));
          if (params.get('state')) {
            initialImport = JSON.parse(decodeURIComponent(params.get('state')));
          }
        }
      } catch (e) {}

      const [accessMode, setAccessMode] = useState(initialMode);
      const [activeTab, setActiveTab] = useState('live');
      const [toastMessage, setToastMessage] = useState('');

      const cachedRound = safeLoadJSON(STORAGE_KEY_ROUND, null);
      const seed = initialImport || cachedRound;

      const [tripId, setTripId] = useState(() => initialTrip || seed?.tripId || 'GolfTrip2026');
      const [sheetsUrl, setSheetsUrl] = useState(() => initialApi || seed?.sheetsWebhookUrl || DEFAULT_SHEETS_URL);
      const [isSyncing, setIsSyncing] = useState(false);

      const [savedCourses, setSavedCourses] = useState(() => safeLoadJSON(STORAGE_KEY_COURSES, DEFAULT_COURSES));
      const [savedRoster, setSavedRoster] = useState(() => safeLoadJSON(STORAGE_KEY_ROSTER, DEFAULT_PLAYERS));

      const [courseName, setCourseName] = useState(() => seed?.courseName || seed?.c || 'Pinehurst No. 2');
      const [roundDate, setRoundDate] = useState(() => seed?.roundDate || seed?.d || new Date().toISOString().split('T')[0]);
      const [holesCount, setHolesCount] = useState(() => seed?.holesCount || seed?.h || 18);
      const [holes, setHoles] = useState(() => seed?.holes || seed?.hl || DEFAULT_COURSES[0].holes);
      const [players, setPlayers] = useState(() => seed?.players || seed?.p || DEFAULT_PLAYERS);
      const [teams, setTeams] = useState(() => seed?.teams || seed?.t || [{ id: 'A', name: 'Team Eagles' }, { id: 'B', name: 'Team Birdies' }]);
      const [activeGame, setActiveGame] = useState(() => seed?.activeGame || seed?.g || 'best_ball');
      const [pointsWager, setPointsWager] = useState(() => seed?.pointsWager || seed?.w || 10);

      const [scores, setScores] = useState(() => {
        const raw = seed?.scores || seed?.s;
        if (raw && Object.keys(raw).length > 0) return raw;
        const initial = {};
        for (let i = 1; i <= 18; i++) initial[i] = { p1: null, p2: null, p3: null, p4: null };
        return initial;
      });

      const [currentHole, setCurrentHole] = useState(() => seed?.currentHole || 1);
      const [selectedPlayerId, setSelectedPlayerId] = useState('p1');
      const [showOtherModal, setShowOtherModal] = useState(false);
      const [manualScoreInput, setManualScoreInput] = useState('');
      const [showRosterModal, setShowRosterModal] = useState(false);

      const lastLocalEditRef = useRef(0);
      const isInitialMount = useRef(true);

      const showToast = useCallback((msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 2200);
      }, []);

      const triggerHaptic = useCallback(() => {
        if (navigator.vibrate) {
          try { navigator.vibrate(12); } catch (e) {}
        }
      }, []);

      // Switch game format reliably
      const handleGameSelect = useCallback((gameId) => {
        lastLocalEditRef.current = Date.now();
        setActiveGame(gameId);
        const gameObj = GAME_TYPES.find(g => g.id === gameId);
        showToast(`Game: ${gameObj ? gameObj.name : gameId}`);
      }, [showToast]);

      // Pull from Cloud (Google Sheet)
      const pullFromCloud = useCallback(async (targetUrl, targetTrip) => {
        const url = targetUrl || sheetsUrl;
        const trip = targetTrip || tripId;
        if (!url) return;

        try {
          setIsSyncing(true);
          const res = await fetch(`${url}${url.includes('?') ? '&' : '?'}trip=${encodeURIComponent(trip)}&t=${Date.now()}`);
          const cloudData = await res.json();
          
          if (cloudData && cloudData.courseName) {
            if (cloudData.scores) {
              setScores(prev => {
                const next = { ...prev };
                Object.keys(cloudData.scores).forEach(hNum => {
                  next[hNum] = next[hNum] || {};
                  const cloudHole = cloudData.scores[hNum] || {};
                  Object.keys(cloudHole).forEach(pId => {
                    const cloudCell = cloudHole[pId];
                    const localCell = next[hNum][pId];
                    const cloudVal = typeof cloudCell === 'object' && cloudCell !== null ? cloudCell.val : cloudCell;
                    const cloudTs = typeof cloudCell === 'object' && cloudCell !== null ? (cloudCell.ts || 0) : 0;
                    const localTs = typeof localCell === 'object' && localCell !== null ? (localCell.ts || 0) : 0;
                    if (cloudTs >= localTs || localCell === undefined) {
                      next[hNum][pId] = { val: cloudVal, ts: cloudTs };
                    }
                  });
                });
                return next;
              });
            }

            if (Date.now() - lastLocalEditRef.current > 4000) {
              setCourseName(cloudData.courseName);
              setRoundDate(cloudData.roundDate || new Date().toISOString().split('T')[0]);
              setHolesCount(cloudData.holesCount || cloudData.holes?.length || 18);
              if (cloudData.holes) setHoles(cloudData.holes);
              if (cloudData.players) setPlayers(cloudData.players);
              if (cloudData.teams) setTeams(cloudData.teams);
              if (cloudData.activeGame) setActiveGame(cloudData.activeGame);
              if (cloudData.pointsWager) setPointsWager(cloudData.pointsWager);
              if (cloudData.savedCourses) setSavedCourses(cloudData.savedCourses);
              if (cloudData.savedRoster) setSavedRoster(cloudData.savedRoster);
            }
          }
        } catch (err) {
          console.warn('Cloud pull skipped (offline)');
        } finally {
          setIsSyncing(false);
        }
      }, [sheetsUrl, tripId]);

      // Push to Cloud (Google Sheet)
      const pushToCloud = useCallback(async () => {
        if (!sheetsUrl || accessMode === 'ro') return;
        setIsSyncing(true);
        try {
          const payload = {
            tripId,
            timestamp: new Date().toISOString(),
            courseName,
            roundDate,
            activeGame,
            pointsWager,
            holesCount,
            players,
            teams,
            scores,
            holes: holes.slice(0, holesCount),
            savedCourses,
            savedRoster
          };

          await fetch(sheetsUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        } catch (err) {
          console.warn('Cloud push offline');
        } finally {
          setIsSyncing(false);
        }
      }, [sheetsUrl, accessMode, tripId, courseName, roundDate, activeGame, pointsWager, holesCount, players, teams, scores, holes, savedCourses, savedRoster]);

      // Clean URL State on load
      useEffect(() => {
        if (window.location.hash.includes('state=')) {
          try {
            history.replaceState(null, '', window.location.pathname + (accessMode === 'ro' ? '#mode=readonly' : ''));
          } catch (e) {}
        }
      }, [accessMode]);

      // Bulletproof Permanent Auto-Save
      useEffect(() => {
        if (isInitialMount.current) {
          isInitialMount.current = false;
          return;
        }

        if (accessMode === 'rw') {
          safeSaveJSON(STORAGE_KEY_ROUND, {
            tripId, courseName, roundDate, holesCount, holes, players, teams, activeGame, pointsWager, scores, currentHole, sheetsWebhookUrl: sheetsUrl
          });
          safeSaveJSON(STORAGE_KEY_COURSES, savedCourses);
          safeSaveJSON(STORAGE_KEY_ROSTER, savedRoster);

          const timer = setTimeout(() => {
            pushToCloud();
          }, 1500);
          return () => clearTimeout(timer);
        }
      }, [accessMode, tripId, courseName, roundDate, holesCount, holes, players, teams, activeGame, pointsWager, scores, currentHole, sheetsUrl, savedCourses, savedRoster, pushToCloud]);

      // Background Cloud Polling
      useEffect(() => {
        if (!sheetsUrl) return;
        const rate = accessMode === 'ro' ? 12000 : 30000;
        const interval = setInterval(() => {
          pullFromCloud(sheetsUrl, tripId);
        }, rate);
        return () => clearInterval(interval);
      }, [sheetsUrl, tripId, accessMode, pullFromCloud]);

      const getRawScore = useCallback((holeNum, playerId) => {
        const cell = scores[holeNum]?.[playerId];
        if (cell === null || cell === undefined) return null;
        return typeof cell === 'object' ? cell.val : cell;
      }, [scores]);

      const handleSetScore = useCallback((holeNum, playerId, scoreValue) => {
        if (accessMode === 'ro') {
          showToast('Spectator Mode: Scoring is locked');
          return;
        }

        triggerHaptic();
        lastLocalEditRef.current = Date.now();
        const val = (scoreValue === null || scoreValue === undefined || scoreValue === '') ? null : Number(scoreValue);

        setScores(prev => ({
          ...prev,
          [holeNum]: {
            ...(prev[holeNum] || {}),
            [playerId]: { val, ts: Date.now() }
          }
        }));
      }, [accessMode, triggerHaptic, showToast]);

      const advanceToNext = useCallback(() => {
        const pIdx = players.findIndex(p => p.id === selectedPlayerId);
        if (pIdx < players.length - 1) {
          setSelectedPlayerId(players[pIdx + 1].id);
        } else {
          if (currentHole < holesCount) {
            setCurrentHole(prev => prev + 1);
            setSelectedPlayerId(players[0].id);
          }
        }
      }, [players, selectedPlayerId, currentHole, holesCount]);

      // COURSE LIBRARY ACTIONS
      const handleSaveCurrentCourseToLibrary = () => {
        lastLocalEditRef.current = Date.now();
        const courseEntry = {
          id: `c_${Date.now()}`,
          name: courseName.trim() || 'Custom Course',
          holesCount: Number(holesCount),
          holes: JSON.parse(JSON.stringify(holes.slice(0, holesCount)))
        };

        const updated = [courseEntry, ...savedCourses.filter(c => c.name.toLowerCase() !== courseEntry.name.toLowerCase())];
        setSavedCourses(updated);
        safeSaveJSON(STORAGE_KEY_COURSES, updated);
        showToast(`Saved "${courseEntry.name}" to library!`);
      };

      const handleLoadCourseFromLibrary = (courseObj) => {
        if (accessMode === 'ro') return;
        lastLocalEditRef.current = Date.now();
        setCourseName(courseObj.name);
        setHolesCount(courseObj.holesCount);
        setHoles(JSON.parse(JSON.stringify(courseObj.holes)));
        
        const newScores = {};
        for (let i = 1; i <= courseObj.holesCount; i++) {
          newScores[i] = {};
          players.forEach(p => { newScores[i][p.id] = null; });
        }
        setScores(newScores);
        setCurrentHole(1);
        showToast(`Loaded "${courseObj.name}"!`);
      };

      const handleDeleteCourseFromLibrary = (id, name) => {
        if (confirm(`Delete "${name}" from permanent library?`)) {
          lastLocalEditRef.current = Date.now();
          const updated = savedCourses.filter(c => c.id !== id);
          setSavedCourses(updated);
          safeSaveJSON(STORAGE_KEY_COURSES, updated);
          showToast(`Deleted "${name}"`);
        }
      };

      const handleUpdateHole = (holeNum, field, val) => {
        if (accessMode === 'ro') return;
        lastLocalEditRef.current = Date.now();
        setHoles(prev => prev.map(h => h.num === holeNum ? { ...h, [field]: Number(val) || val } : h));
      };

      // GOLFER ROSTER ACTIONS
      const handleSaveCurrentPlayersToRoster = () => {
        lastLocalEditRef.current = Date.now();
        const rosterMap = new Map(savedRoster.map(p => [p.name.toLowerCase(), p]));
        players.forEach(p => {
          rosterMap.set(p.name.toLowerCase(), {
            id: p.id.startsWith('sp') ? p.id : `sp_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`,
            name: p.name.trim(),
            hcp: Number(p.hcp) || 0,
            color: p.color
          });
        });
        const updated = Array.from(rosterMap.values());
        setSavedRoster(updated);
        safeSaveJSON(STORAGE_KEY_ROSTER, updated);
        showToast('Saved active players to Roster!');
      };

      const handleAddPlayerFromSavedRoster = (savedPlayer) => {
        lastLocalEditRef.current = Date.now();
        if (players.some(p => p.name.toLowerCase() === savedPlayer.name.toLowerCase())) {
          showToast(`${savedPlayer.name} is already in the round`);
          return;
        }
        const newPlayerInstance = {
          id: `p_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`,
          name: savedPlayer.name,
          hcp: Number(savedPlayer.hcp) || 0,
          team: players.length % 2 === 0 ? 'A' : 'B',
          color: savedPlayer.color || COLOR_PALETTE[players.length % COLOR_PALETTE.length]
        };
        setPlayers(prev => [...prev, newPlayerInstance]);
        showToast(`Added ${savedPlayer.name}!`);
      };

      const handleDeletePlayerFromRoster = (id, name) => {
        const updated = savedRoster.filter(p => p.id !== id);
        setSavedRoster(updated);
        safeSaveJSON(STORAGE_KEY_ROSTER, updated);
        showToast(`Removed "${name}" from Roster`);
      };

      const handleAddBlankPlayer = () => {
        if (accessMode === 'ro') return;
        lastLocalEditRef.current = Date.now();
        const newId = `p_${Date.now()}`;
        const color = COLOR_PALETTE[players.length % COLOR_PALETTE.length];
        setPlayers(prev => [
          ...prev,
          { id: newId, name: `Player ${prev.length + 1}`, hcp: 10, team: prev.length % 2 === 0 ? 'A' : 'B', color }
        ]);
        showToast('Added golfer slot');
      };

      const handleDeleteActivePlayer = (id) => {
        if (accessMode === 'ro') return;
        if (players.length <= 1) {
          showToast('Must keep at least 1 player');
          return;
        }
        lastLocalEditRef.current = Date.now();
        setPlayers(prev => prev.filter(p => p.id !== id));
      };

      const handleUpdatePlayer = (id, field, value) => {
        if (accessMode === 'ro') return;
        lastLocalEditRef.current = Date.now();
        setPlayers(prev => prev.map(p => p.id === id ? { ...p, [field]: value } : p));
      };

      const handleManualReset = () => {
        if (confirm("Reset active scores for this round? (Your saved courses and player roster will NOT be deleted)")) {
          lastLocalEditRef.current = Date.now();
          const freshScores = {};
          for (let i = 1; i <= holesCount; i++) freshScores[i] = {};
          setScores(freshScores);
          setCurrentHole(1);
          showToast('Round scores reset!');
        }
      };

      // Player Metrics Calculations
      const playerStats = useMemo(() => {
        return players.map(player => {
          let totalGross = 0, totalNet = 0, totalPar = 0, holesPlayed = 0, stablefordPoints = 0, skinsWon = 0;

          holes.slice(0, holesCount).forEach(h => {
            const gross = getRawScore(h.num, player.id);
            if (gross !== null && gross > 0) {
              holesPlayed++;
              totalGross += Number(gross);
              totalPar += h.par;
              const strokes = getStrokesGiven(player.hcp, h.hcp, holesCount);
              const net = Number(gross) - strokes;
              totalNet += net;

              const netDiff = net - h.par;
              if (netDiff <= -3) stablefordPoints += 5;
              else if (netDiff === -2) stablefordPoints += 4;
              else if (netDiff === -1) stablefordPoints += 3;
              else if (netDiff === 0) stablefordPoints += 2;
              else if (netDiff === 1) stablefordPoints += 1;
            }
          });

          holes.slice(0, holesCount).forEach(h => {
            const validHoleNets = players.map(p => {
              const raw = getRawScore(h.num, p.id);
              return raw ? (raw - getStrokesGiven(p.hcp, h.hcp, holesCount)) : null;
            }).filter(s => s !== null);

            if (validHoleNets.length === players.length && players.length > 0) {
              const myGross = getRawScore(h.num, player.id);
              if (myGross) {
                const myNet = myGross - getStrokesGiven(player.hcp, h.hcp, holesCount);
                const min = Math.min(...validHoleNets);
                if (myNet === min && validHoleNets.filter(v => v === min).length === 1) {
                  skinsWon++;
                }
              }
            }
          });

          const scoreToPar = totalGross - totalPar;
          const netToPar = totalNet - totalPar;
          const quotaTarget = Math.max(1, 36 - player.hcp);
          const quotaDiff = stablefordPoints - (holesPlayed / holesCount * quotaTarget);

          return {
            ...player,
            holesPlayed,
            totalGross,
            totalNet,
            scoreToPar: holesPlayed > 0 ? (scoreToPar > 0 ? `+${scoreToPar}` : scoreToPar === 0 ? 'E' : `${scoreToPar}`) : '-',
            netToPar: holesPlayed > 0 ? (netToPar > 0 ? `+${netToPar}` : netToPar === 0 ? 'E' : `${netToPar}`) : '-',
            rawNetToPar: netToPar,
            stablefordPoints,
            quotaDiff: quotaDiff >= 0 ? `+${quotaDiff.toFixed(1)}` : quotaDiff.toFixed(1),
            rawQuotaDiff: quotaDiff,
            skinsWon
          };
        });
      }, [players, holes, holesCount, getRawScore]);

      const gameEngine = useMemo(() => {
        const tA = playerStats.filter(p => p.team === 'A');
        const tB = playerStats.filter(p => p.team === 'B');

        let teamANet = 0, teamBNet = 0;
        holes.slice(0, holesCount).forEach(h => {
          const aNets = tA.map(p => {
            const raw = getRawScore(h.num, p.id);
            return raw ? raw - getStrokesGiven(p.hcp, h.hcp, holesCount) : null;
          }).filter(s => s !== null);

          const bNets = tB.map(p => {
            const raw = getRawScore(h.num, p.id);
            return raw ? raw - getStrokesGiven(p.hcp, h.hcp, holesCount) : null;
          }).filter(s => s !== null);

          if (aNets.length > 0) teamANet += Math.min(...aNets);
          if (bNets.length > 0) teamBNet += Math.min(...bNets);
        });

        // Vegas
        let vegasTeamA = 0, vegasTeamB = 0;
        holes.slice(0, holesCount).forEach(h => {
          const sA1 = getRawScore(h.num, tA[0]?.id);
          const sA2 = getRawScore(h.num, tA[1]?.id);
          const sB1 = getRawScore(h.num, tB[0]?.id);
          const sB2 = getRawScore(h.num, tB[1]?.id);

          if (sA1 && sA2 && sB1 && sB2) {
            let aLow = Math.min(sA1, sA2), aHigh = Math.max(sA1, sA2);
            let bLow = Math.min(sB1, sB2), bHigh = Math.max(sB1, sB2);
            let valA = parseInt(`${aLow}${aHigh}`, 10);
            let valB = parseInt(`${bLow}${bHigh}`, 10);

            if (aLow < h.par && bLow >= h.par) valB = parseInt(`${bHigh}${bLow}`, 10);
            else if (bLow < h.par && aLow >= h.par) valA = parseInt(`${aHigh}${aLow}`, 10);

            const diff = valB - valA;
            if (diff > 0) vegasTeamA += diff;
            else if (diff < 0) vegasTeamB += Math.abs(diff);
          }
        });

        // Skins
        const skinsList = [];
        let carryover = 0;
        holes.slice(0, holesCount).forEach(h => {
          const holeScores = players.map(p => {
            const raw = getRawScore(h.num, p.id);
            return raw ? { player: p, net: raw - getStrokesGiven(p.hcp, h.hcp, holesCount) } : null;
          }).filter(Boolean);

          let winner = null;
          let skinValue = 1 + carryover;
          if (holeScores.length === players.length && players.length > 0) {
            const min = Math.min(...holeScores.map(s => s.net));
            const winners = holeScores.filter(s => s.net === min);
            if (winners.length === 1) {
              winner = winners[0].player;
              carryover = 0;
            } else {
              carryover += 1;
            }
          }
          skinsList.push({ hole: h.num, par: h.par, skinValue, winner, carryover });
        });

        return {
          bestBall: { teamANet, teamBNet },
          vegas: { vegasTeamA, vegasTeamB, diff: vegasTeamA - vegasTeamB },
          skins: { skinsList, currentCarryover: skinsList[skinsList.length - 1]?.carryover || 0 }
        };
      }, [playerStats, holes, holesCount, getRawScore, players]);

      const renderScoreBadge = (gross, par) => {
        if (!gross) return <span className="text-gray-500 font-mono text-[11px]">-</span>;
        const diff = Number(gross) - par;
        if (diff <= -2) return <span className="inline-flex items-center justify-center w-6 h-6 rounded-full bg-amber-200 text-amber-950 border-2 border-amber-500 ring-1 ring-amber-400 font-black text-[11px] leading-none">{gross}</span>;
        if (diff === -1) return <span className="inline-flex items-center justify-center w-6 h-6 rounded-full bg-emerald-200 text-emerald-950 border-2 border-emerald-600 font-black text-[11px] leading-none">{gross}</span>;
        if (diff === 0) return <span className="inline-flex items-center justify-center w-6 h-6 text-gray-100 font-bold text-[11px] leading-none">{gross}</span>;
        if (diff === 1) return <span className="inline-flex items-center justify-center w-5 h-5 bg-orange-200 text-orange-950 border border-orange-500 font-black text-[11px] leading-none">{gross}</span>;
        return <span className="inline-flex items-center justify-center w-5 h-5 bg-red-200 text-red-950 border border-red-600 ring-1 ring-red-400 font-black text-[11px] leading-none">{gross}</span>;
      };

      const handleGenerateLink = (targetMode) => {
        const modeParam = targetMode === 'ro' ? 'mode=readonly' : 'mode=scorer';
        const tripParam = `trip=${encodeURIComponent(tripId)}`;
        const apiParam = sheetsUrl ? `&api=${encodeURIComponent(sheetsUrl)}` : '';
        const url = `${window.location.origin}${window.location.pathname}#${modeParam}&${tripParam}${apiParam}`;

        const temp = document.createElement('input');
        temp.value = url;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        showToast(targetMode === 'ro' ? 'Viewer Link Copied!' : 'Scorer Link Copied!');
      };

      const currentHoleData = holes.find(h => h.num === currentHole) || { num: currentHole, par: 4, hcp: 1, yardage: 400 };
      const activePlayer = players.find(p => p.id === selectedPlayerId) || players[0];
      const activePlayerRaw = getRawScore(currentHole, activePlayer?.id);
      const activePlayerStrokes = activePlayer ? getStrokesGiven(activePlayer.hcp, currentHoleData.hcp, holesCount) : 0;
      const isHigherThanTriple = activePlayerRaw && activePlayerRaw > currentHoleData.par + 3;

      const dynamicColHeader = activeGame === 'stableford' ? 'STB PTS' : activeGame === 'quota' ? 'QUOTA' : activeGame === 'skins' ? 'SKINS' : 'NET';

      return (
        <div className="flex flex-col h-[100dvh] w-full max-w-lg mx-auto bg-slate-950 text-slate-100 overflow-hidden select-none">
          
          {/* Top Global Bar */}
          <header className="safe-top flex items-center justify-between px-3 py-1.5 bg-slate-900 border-b border-slate-800 shrink-0 z-20">
            <div className="flex items-center space-x-2">
              <div className="w-7 h-7 rounded-lg bg-emerald-600 flex items-center justify-center font-black text-sm text-white shadow">⛳</div>
              <div>
                <div className="flex items-center gap-1.5">

                  <span className={`text-[9px] px-1 py-0.5 rounded font-bold uppercase ${accessMode === 'ro' ? 'bg-blue-500/20 text-blue-400' : 'bg-emerald-500/20 text-emerald-400'}`}>
                    {accessMode === 'ro' ? 'Viewer' : 'Scorer'}
                  </span>
                </div>
                {accessMode === 'rw' ? (
                  <select

                    {GAME_TYPES.map(g => (

                  <p className="text-[10px] text-emerald-400 font-bold truncate max-w-[150px]">{GAME_TYPES.find(g => g.id === activeGame)?.name}</p>

              </div>
            </div>

            <div className="flex items-center space-x-1">
              {accessMode === 'rw' ? (
                <button onClick={() => handleGenerateLink('ro')} className="px-2 py-1 rounded-md bg-blue-900/60 text-blue-200 text-[11px] font-semibold border border-blue-700/60 active:scale-95 transition">
                  Share

                </button>
              )}
              <button onClick={() => pullFromCloud()} disabled={isSyncing} className={`p-1 rounded-md bg-emerald-900/60 hover:bg-emerald-800 text-emerald-200 border border-emerald-700/60 text-xs active:scale-95 transition ${isSyncing ? 'animate-spin' : ''}`} title="Sync with Cloud">
                🔄
              </button>
            </div>
          </header>

          {/* Toast Notification */}
          {toastMessage && (

          {/* 4+ Score Modal */}
          {showOtherModal && (

                    <p className="text-[11px] text-slate-400">Tap a golfer to add them to today's round</p>
                  </div>
                  <button onClick={() => setShowRosterModal(false)} className="text-slate-400 hover:text-white font-bold p-1">✕</button>
                </div>

                <div className="max-h-60 overflow-y-auto space-y-1.5 divide-y divide-slate-800">
                  {savedRoster.map(sp => (
                    <div key={sp.id} className="pt-1.5 flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <span className="w-3 h-3 rounded-full shrink-0" style={{ backgroundColor: sp.color }} />
                        <span className="text-xs font-bold text-white">{sp.name}</span>
                        <span className="text-[10px] text-slate-400 font-mono">HCP {sp.hcp}</span>
                      </div>
                      <button 
                        onClick={() => {
                          handleAddPlayerFromSavedRoster(sp);
                          setShowRosterModal(false);
                        }}
                        className="px-2.5 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-black text-[11px] active:scale-95 transition"
                      >
                        + Add
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Main App Layout */}
          <main className="flex-1 flex flex-col min-h-0 overflow-hidden relative">

            {/* TAB 1: LIVE SCORING VIEW */}
            {activeTab === 'live' && (
              <div className="flex-1 flex flex-col min-h-0 overflow-hidden">
                
                {/* Visual Scorecard Top Half */}
                <div className="flex-1 min-h-[140px] max-h-[48%] flex flex-col bg-slate-900/40 border-b border-slate-800/80 overflow-hidden">
                  
                  {/* Standings Banner (Adapts dynamically to the active game) */}
                  <div className="px-2 py-1 bg-slate-900 border-b border-slate-800/80 flex items-center gap-1.5 overflow-x-auto no-scrollbar shrink-0">
                    {(activeGame === 'best_ball' || activeGame === 'scramble' || activeGame === 'shamble' || activeGame === 'match_play') && (
                      <>
                        <div className="flex items-center gap-1.5 px-2 py-0.5 rounded-md border border-emerald-500/40 bg-emerald-950/40 text-emerald-300 text-[11px] font-bold shrink-0">
                          <span>{teams[0]?.name}:</span>
                          <span className="font-mono text-white bg-slate-900 px-1 rounded">{gameEngine.bestBall.teamANet || 'E'} Net</span>
                        </div>
                        <div className="flex items-center gap-1.5 px-2 py-0.5 rounded-md border border-amber-500/40 bg-amber-950/40 text-amber-300 text-[11px] font-bold shrink-0">
                          <span>{teams[1]?.name}:</span>
                          <span className="font-mono text-white bg-slate-900 px-1 rounded">{gameEngine.bestBall.teamBNet || 'E'} Net</span>
                        </div>
                      </>
                    )}

                    {activeGame === 'vegas' && (
                      <>
                        <div className="flex items-center gap-1.5 px-2 py-0.5 rounded-md border border-emerald-500/40 bg-emerald-950/40 text-emerald-300 text-[11px] font-bold shrink-0">
                          <span>Eagles:</span>
                          <span className="font-mono text-white bg-slate-900 px-1 rounded">{gameEngine.vegas.vegasTeamA} pts</span>
                        </div>
                        <div className="flex items-center gap-1.5 px-2 py-0.5 rounded-md border border-amber-500/40 bg-amber-950/40 text-amber-300 text-[11px] font-bold shrink-0">
                          <span>Birdies:</span>
                          <span className="font-mono text-white bg-slate-900 px-1 rounded">{gameEngine.vegas.vegasTeamB} pts</span>
                        </div>
                        <div className="flex items-center gap-1 px-2 py-0.5 rounded-md bg-purple-950/40 border border-purple-500/40 text-[11px] shrink-0 text-purple-300">
                          <span>Diff:</span>
                          <span className="font-bold text-white font-mono">{Math.abs(gameEngine.vegas.diff)} pts</span>
                        </div>
                      </>
                    )}

                    {activeGame === 'skins' && (
                      <div className="flex items-center gap-1.5 px-2 py-0.5 rounded-md border border-purple-500/40 bg-purple-950/40 text-purple-300 text-[11px] font-bold shrink-0">
                        <span>Carryover:</span>
                        <span className="font-mono text-white bg-slate-900 px-1 rounded">{gameEngine.skins.currentCarryover} Skins</span>
                      </div>
                    )}

                    {activeGame === 'stableford' && (
                      <div className="flex items-center gap-1.5 px-2 py-0.5 rounded-md border border-amber-500/40 bg-amber-950/40 text-amber-300 text-[11px] font-bold shrink-0">
                        <span>Leader:</span>
                        <span className="font-mono text-white bg-slate-900 px-1 rounded">{[...playerStats].sort((a,b) => b.stablefordPoints - a.stablefordPoints)[0]?.name} ({[...playerStats].sort((a,b) => b.stablefordPoints - a.stablefordPoints)[0]?.stablefordPoints}p)</span>
                      </div>
                    )}

                    {activeGame === 'quota' && (
                      <div className="flex items-center gap-1.5 px-2 py-0.5 rounded-md border border-emerald-500/40 bg-emerald-950/40 text-emerald-300 text-[11px] font-bold shrink-0">
                        <span>Leader:</span>
                        <span className="font-mono text-white bg-slate-900 px-1 rounded">{[...playerStats].sort((a,b) => b.rawQuotaDiff - a.rawQuotaDiff)[0]?.name} ({[...playerStats].sort((a,b) => b.rawQuotaDiff - a.rawQuotaDiff)[0]?.quotaDiff})</span>
                      </div>
                    )}
                  </div>

                  {/* Physical Scorecard Table */}
                  <div className="flex-1 overflow-auto p-1.5">
                    <table className="min-w-full text-center border-collapse text-[11px]">
                      <thead>
                        <tr className="bg-slate-900 text-slate-300 font-semibold border-b border-slate-800">
                          <th className="sticky left-0 bg-slate-900 px-1.5 py-1 text-left w-20 z-10">HOLE</th>
                          {holes.slice(0, holesCount).map(hItem => (
                            <th 
                              key={hItem.num} 
                              onClick={() => setCurrentHole(hItem.num)} 
                              className={`px-1.5 py-0.5 font-mono cursor-pointer ${currentHole === hItem.num ? 'bg-emerald-600 text-white font-bold' : 'text-slate-300'}`}
                            >
                              {hItem.num}
                            </th>
                          ))}
                          <th className="px-1.5 py-0.5 bg-slate-800 font-bold">TOT</th>
                          <th className="px-1.5 py-0.5 bg-slate-800 font-bold">{dynamicColHeader}</th>
                        </tr>
                        <tr className="bg-slate-900/90 text-[10px] text-slate-400 border-b border-slate-800 font-mono">
                          <td className="sticky left-0 bg-slate-900 px-1.5 py-0.5 text-left font-bold z-10">PAR</td>
                          {holes.slice(0, holesCount).map(hItem => (
                            <td key={hItem.num} className={`py-0.5 ${currentHole === hItem.num ? 'bg-emerald-950 text-emerald-400 font-bold' : ''}`}>
                              {hItem.par}
                            </td>
                          ))}
                          <td>{holes.slice(0, holesCount).reduce((a, b) => a + b.par, 0)}</td>
                          <td>-</td>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/80">
                        {players.map(player => {
                          const stats = playerStats.find(p => p.id === player.id);
                          return (
                            <tr 
                              key={player.id} 
                              onClick={() => setSelectedPlayerId(player.id)} 
                              className={`cursor-pointer ${selectedPlayerId === player.id ? 'bg-slate-800/60 font-semibold' : ''}`}
                            >
                              <td className="sticky left-0 bg-slate-900 px-1.5 py-1 text-left border-r border-slate-800 z-10">

                                  <span className="font-bold text-[11px] text-white truncate max-w-[65px]">{player.name}</span>
                                </div>
                              </td>
                              {holes.slice(0, holesCount).map(hItem => {
                                const raw = getRawScore(hItem.num, player.id);
                                const dots = getStrokesGiven(player.hcp, hItem.hcp, holesCount);
                                return (
                                  <td 
                                    key={hItem.num}

                                    className={`p-0.5 relative ${currentHole === hItem.num && selectedPlayerId === player.id ? 'ring-1.5 ring-emerald-400 bg-emerald-950/40 rounded' : ''}`}
                                  >
                                    {renderScoreBadge(raw, hItem.par)}
                                    {dots > 0 && <div className="absolute top-0.5 right-0.5 text-[7px] leading-none text-emerald-400 font-black">{'•'.repeat(dots)}</div>}

                </div>

                {/* Bottom Half Thumb Scoring Pad */}

                      <button

                            key={p.id} 
                            onClick={() => setSelectedPlayerId(p.id)} 
                            className={`flex-1 min-w-[105px] py-1.5 px-2 rounded-xl flex items-center justify-between border transition active:scale-95 ${p.id === selectedPlayerId ? 'bg-slate-800 border-emerald-500 ring-1.5 ring-emerald-500/80 shadow' : 'bg-slate-900/90 border-slate-800 opacity-70'}`}
                          >
                            <div className="flex items-center gap-1.5 truncate">
                              <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ backgroundColor: p.color }} />
                              <span className="text-[11px] font-black text-white truncate">{p.name}</span>
                            </div>
                            <span className="text-[11px] font-mono font-black px-1.5 py-0.5 rounded bg-emerald-500 text-slate-950">{raw || '-'}</span>
                          </button>
                        );
                      })}
                    </div>

                    {/* Fast 6 Quick Buttons */}
                    <div className="grid grid-cols-3 gap-1.5 flex-1 min-h-[90px]">
                      {[
                        { label: '🦅 Eagle', diff: `-2 (${currentHoleData.par - 2})`, val: currentHoleData.par - 2, bg: 'bg-amber-500 hover:bg-amber-600' },
                        { label: '🐦 Birdie', diff: `-1 (${currentHoleData.par - 1})`, val: currentHoleData.par - 1, bg: 'bg-emerald-600 hover:bg-emerald-700' },
                        { label: '⛳ Par', diff: `E (${currentHoleData.par})`, val: currentHoleData.par, bg: 'bg-slate-700 hover:bg-slate-800' },
                        { label: '🟧 Bogey', diff: `+1 (${currentHoleData.par + 1})`, val: currentHoleData.par + 1, bg: 'bg-orange-500 hover:bg-orange-600' },
                        { label: '🟥 Double', diff: `+2 (${currentHoleData.par + 2})`, val: currentHoleData.par + 2, bg: 'bg-red-500 hover:bg-red-600' },
                        { label: '🟥 Triple', diff: `+3 (${currentHoleData.par + 3})`, val: currentHoleData.par + 3, bg: 'bg-red-700 hover:bg-red-800' }
                      ].map(btn => (
                        <button 
                          key={btn.label} 
                          onClick={() => { handleSetScore(currentHole, selectedPlayerId, btn.val); advanceToNext(); }} 
                          className={`py-2 px-1 rounded-xl font-bold text-xs sm:text-sm flex flex-col items-center justify-center shadow active:scale-95 transition text-white ${btn.bg}`}
                        >
                          <span className="font-black leading-tight text-xs sm:text-sm">{btn.label}</span>
                          <span className="text-[9px] opacity-90 uppercase font-semibold mt-0.5">{btn.diff}</span>
                        </button>
                      ))}
                    </div>

                    {/* Utility Action Buttons */}
                    <div className="grid grid-cols-2 gap-1.5 shrink-0">
                      <button 
                        onClick={() => { setManualScoreInput(''); setShowOtherModal(true); }} 
                        className={`py-2 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 border border-red-700/80 active:scale-95 transition ${isHigherThanTriple ? 'bg-red-700 text-white ring-1 ring-white' : 'bg-red-950/80 text-red-200 hover:bg-red-900'}`}
                      >
                        <span className="font-black">🟥 +4 / Other</span>
                        <span className="text-[10px] font-mono opacity-80">{isHigherThanTriple ? `(${activePlayerRaw})` : `(${currentHoleData.par + 4}+)`}</span>
                      </button>
                      <button 
                        onClick={() => handleSetScore(currentHole, selectedPlayerId, null)} 
                        className="py-2 rounded-xl font-bold text-xs bg-slate-800/90 text-slate-300 border border-slate-700 flex items-center justify-center gap-1 active:scale-95 transition hover:bg-slate-700"
                      >
                        Clear Score
                      </button>
                    </div>

                  </div>
                ) : (
                  <div className="flex-1 flex flex-col justify-center items-center text-center p-4 space-y-2">
                    <div className="p-3 bg-blue-950/40 border border-blue-500/30 rounded-xl max-w-xs">
                      <h3 className="text-xs font-black text-white">Live Spectator Mode</h3>
                      <p className="text-[11px] text-blue-300">Connected to Trip Cloud: {tripId}</p>
                    </div>
                    <button onClick={() => setAccessMode('rw')} className="px-5 py-2 rounded-xl bg-emerald-600 font-bold text-slate-950 text-xs shadow active:scale-95 transition">Unlock Scoring</button>
                  </div>
                )}
              </div>
            )}

            {/* TAB 2: TOURNAMENT GAMES & SELECTION */}
            {activeTab === 'games' && (
              <div className="flex-1 overflow-y-auto p-3 space-y-3">
                <div className="flex items-center justify-between">
                  <h2 className="text-sm font-black text-white">Tournament Games</h2>
                  {accessMode === 'rw' && (
                    <select 
                      value={activeGame} 
                      onChange={e => handleGameSelect(e.target.value)} 
                      className="bg-slate-900 border border-slate-700 text-emerald-400 text-xs font-bold rounded-lg px-2 py-1 outline-none"
                    >
                      {GAME_TYPES.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
                    </select>
                  )}
                </div>

                <div className="p-3 rounded-xl bg-gradient-to-r from-emerald-950/60 to-slate-900 border border-emerald-500/30">
                  <span className="text-xs font-black uppercase text-emerald-400 block mb-0.5">{GAME_TYPES.find(g => g.id === activeGame)?.name}</span>
                  <p className="text-[11px] text-slate-300">{GAME_TYPES.find(g => g.id === activeGame)?.desc}</p>
                </div>

                {/* Quick 1-Tap Game Switcher Grid */}
                {accessMode === 'rw' && (
                  <div className="space-y-1.5">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Choose Active Tournament Format:</span>
                    <div className="grid grid-cols-2 gap-1.5">
                      {GAME_TYPES.map(g => {
                        const isSelected = g.id === activeGame;
                        return (
                          <button
                            key={g.id}
                            onClick={() => handleGameSelect(g.id)}
                            className={`p-2 rounded-xl border text-left transition active:scale-95 ${isSelected ? 'bg-emerald-950/60 border-emerald-500 text-white ring-1 ring-emerald-500' : 'bg-slate-900/90 border-slate-800 text-slate-300 hover:bg-slate-850'}`}
                          >
                            <span className="text-xs font-bold block truncate">{g.name}</span>
                            <span className="text-[9px] text-slate-400 block truncate">{g.desc}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}

                <div className="grid grid-cols-2 gap-2 pt-1">
                  <div className="p-2.5 bg-slate-900 rounded-xl border border-slate-800 text-center">
                    <span className="text-[11px] text-slate-400 font-bold block">{teams[0]?.name}</span>
                    <span className="text-xl font-mono font-black text-emerald-400">{gameEngine.bestBall.teamANet} Net</span>
                  </div>
                  <div className="p-2.5 bg-slate-900 rounded-xl border border-slate-800 text-center">
                    <span className="text-[11px] text-slate-400 font-bold block">{teams[1]?.name}</span>
                    <span className="text-xl font-mono font-black text-amber-400">{gameEngine.bestBall.teamBNet} Net</span>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: COURSE SETUP & PERMANENT LIBRARY */}
            {activeTab === 'setup' && (
              <div className="flex-1 overflow-y-auto p-3 space-y-3">
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-sm font-black text-white">Course Configuration</h2>
                    <p className="text-[11px] text-slate-400">Edit hole ratings & save to library</p>
                  </div>
                  {accessMode === 'rw' && (
                    <button 
                      onClick={handleSaveCurrentCourseToLibrary}
                      className="px-2.5 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-black text-xs shadow active:scale-95 transition"
                    >
                      💾 Save Course
                    </button>
                  )}
                </div>

                {/* SAVED COURSES LIBRARY */}
                <div className="p-2.5 bg-slate-900 rounded-xl border border-slate-800 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-[11px] font-black uppercase text-emerald-400 tracking-wider">Permanent Course Library</span>
                    <span className="text-[10px] text-slate-400 font-mono">{savedCourses.length} saved</span>
                  </div>
                  
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                    {savedCourses.map(cItem => {
                      const isCurrent = cItem.name.toLowerCase() === courseName.toLowerCase();
                      return (
                        <div key={cItem.id} className={`p-2 rounded-xl border flex items-center justify-between ${isCurrent ? 'bg-emerald-950/40 border-emerald-500/50' : 'bg-slate-800/80 border-slate-700'}`}>
                          <div className="truncate mr-2">
                            <span className="text-xs font-bold text-white block truncate">{cItem.name}</span>
                            <span className="text-[10px] text-slate-400 font-mono">{cItem.holesCount} Holes • Par {cItem.holes.reduce((a,b)=>a+b.par,0)}</span>
                          </div>
                          
                          <div className="flex items-center gap-1 shrink-0">
                            <button
                              onClick={() => handleLoadCourseFromLibrary(cItem)}
                              disabled={isCurrent}
                              className={`px-2 py-1 rounded-md text-[10px] font-black uppercase transition ${isCurrent ? 'bg-emerald-600 text-slate-950 font-bold opacity-80' : 'bg-slate-700 hover:bg-slate-600 text-slate-100 active:scale-95'}`}
                            >
                              {isCurrent ? 'Active' : 'Load'}
                            </button>
                            {savedCourses.length > 1 && (
                              <button 
                                onClick={() => handleDeleteCourseFromLibrary(cItem.id, cItem.name)}
                                className="p-1 text-slate-400 hover:text-red-400 transition"
                              >
                                ✕
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Course Metadata Inputs */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  <div>
                    <label className="text-[10px] font-bold text-slate-400 block mb-0.5">Course Name</label>
                    <input 
                      type="text" 
                      disabled={accessMode === 'ro'} 
                      value={courseName} 
                      onChange={(e) => {
                        lastLocalEditRef.current = Date.now();
                        setCourseName(e.target.value);
                      }} 
                      className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-white font-semibold outline-none focus:border-emerald-500" 
                    />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold text-slate-400 block mb-0.5">Round Date</label>
                    <input 
                      type="date" 
                      disabled={accessMode === 'ro'} 
                      value={roundDate} 
                      onChange={(e) => {
                        lastLocalEditRef.current = Date.now();
                        setRoundDate(e.target.value);
                      }} 
                      className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-white font-semibold outline-none focus:border-emerald-500" 
                    />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold text-slate-400 block mb-0.5">Holes Count</label>
                    <div className="flex gap-1.5">
                      <button 
                        disabled={accessMode === 'ro'} 
                        onClick={() => {
                          lastLocalEditRef.current = Date.now();
                          setHolesCount(9);
                        }} 
                        className={`flex-1 py-1.5 rounded-lg text-xs font-bold border ${holesCount === 9 ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-slate-400 border-slate-800'}`}
                      >
                        9 H
                      </button>
                      <button 
                        disabled={accessMode === 'ro'} 
                        onClick={() => {
                          lastLocalEditRef.current = Date.now();
                          setHolesCount(18);
                        }} 
                        className={`flex-1 py-1.5 rounded-lg text-xs font-bold border ${holesCount === 18 ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-slate-400 border-slate-800'}`}
                      >
                        18 H
                      </button>
                    </div>
                  </div>
                </div>

                {/* Live Hole-by-Hole Editor Table */}
                <div className="space-y-1.5">
                  <span className="text-[11px] font-bold text-slate-400 block uppercase">Hole Pars & HCP Stroke Ratings</span>
                  <div className="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden">
                    <table className="w-full text-center text-xs">
                      <thead className="bg-slate-800 text-slate-400 font-bold">
                        <tr>
                          <th className="p-1.5">Hole</th>
                          <th className="p-1.5">Par</th>
                          <th className="p-1.5">HCP Index</th>
                          <th className="p-1.5">Yds</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {holes.slice(0, holesCount).map(h => (
                          <tr key={h.num}>
                            <td className="p-1.5 font-mono font-bold text-white">#{h.num}</td>
                            <td className="p-1.5">
                              <select 
                                disabled={accessMode === 'ro'} 
                                value={h.par} 
                                onChange={(e) => handleUpdateHole(h.num, 'par', e.target.value)} 
                                className="bg-slate-800 text-white font-bold rounded px-1.5 py-0.5 outline-none"
                              >
                                <option value={3}>Par 3</option>
                                <option value={4}>Par 4</option>
                                <option value={5}>Par 5</option>
                                <option value={6}>Par 6</option>
                              </select>
                            </td>
                            <td className="p-1.5">
                              <input 
                                type="number" 
                                disabled={accessMode === 'ro'} 
                                min="1" 
                                max="18" 
                                value={h.hcp} 
                                onChange={(e) => handleUpdateHole(h.num, 'hcp', e.target.value)} 
                                className="w-12 text-center bg-slate-800 rounded px-1 py-0.5 font-mono text-white text-xs" 
                              />
                            </td>
                            <td className="p-1.5">
                              <input 
                                type="number" 
                                disabled={accessMode === 'ro'} 
                                value={h.yardage} 
                                onChange={(e) => handleUpdateHole(h.num, 'yardage', e.target.value)} 
                                className="w-14 text-center bg-slate-800 rounded px-1 py-0.5 font-mono text-white text-xs" 
                              />
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: PLAYERS & PERMANENT ROSTER */}
            {activeTab === 'roster' && (
              <div className="flex-1 overflow-y-auto p-3 space-y-3">
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-sm font-black text-white">Tournament Lineup</h2>
                    <p className="text-[11px] text-slate-400">{players.length} golfers today</p>
                  </div>
                  {accessMode === 'rw' && (
                    <div className="flex items-center gap-1.5">
                      <button 
                        onClick={() => setShowRosterModal(true)} 
                        className="px-2.5 py-1 rounded-lg bg-blue-600 text-white font-bold text-xs shadow active:scale-95 transition"
                      >
                        👥 Load Saved
                      </button>
                      <button 
                        onClick={handleAddBlankPlayer} 
                        className="px-2.5 py-1 rounded-lg bg-emerald-600 text-white font-bold text-xs shadow active:scale-95 transition"
                      >
                        + New
                      </button>
                    </div>
                  )}
                </div>

                {/* Active Round Players Editor List */}
                <div className="space-y-2">
                  {players.map((player) => (
                    <div key={player.id} className="p-2.5 bg-slate-900 rounded-xl border border-slate-800 space-y-1.5">
                      <div className="flex items-center gap-2">
                        <input 
                          type="color" 
                          disabled={accessMode === 'ro'} 
                          value={player.color} 
                          onChange={(e) => handleUpdatePlayer(player.id, 'color', e.target.value)} 
                          className="w-6 h-6 rounded-full cursor-pointer bg-transparent border-none" 
                        />
                        <input 
                          type="text" 
                          disabled={accessMode === 'ro'} 
                          value={player.name} 
                          onChange={(e) => handleUpdatePlayer(player.id, 'name', e.target.value)} 
                          className="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs font-bold text-white outline-none focus:border-emerald-500" 
                        />
                        {accessMode === 'rw' && (
                          <button onClick={() => handleDeleteActivePlayer(player.id)} className="p-1 text-red-400 hover:text-red-300">
                            🗑️
                          </button>
                        )}
                      </div>
                      <div className="flex items-center justify-between pt-0.5">
                        <div className="flex items-center gap-1">
                          <span className="text-[10px] text-slate-400">HCP Index:</span>
                          <input 
                            type="number" 
                            disabled={accessMode === 'ro'} 
                            value={player.hcp} 
                            onChange={(e) => handleUpdatePlayer(player.id, 'hcp', Number(e.target.value))} 
                            className="w-12 bg-slate-800 border border-slate-700 rounded-md px-1 py-0.5 text-xs font-mono text-center text-white" 
                          />
                        </div>
                        <div className="flex items-center gap-1">
                          <span className="text-[10px] text-slate-400">Team:</span>
                          <select 
                            disabled={accessMode === 'ro'} 
                            value={player.team} 
                            onChange={(e) => handleUpdatePlayer(player.id, 'team', e.target.value)} 
                            className="bg-slate-800 border border-slate-700 rounded-md px-1.5 py-0.5 text-[11px] font-bold text-emerald-400 outline-none"
                          >
                            <option value="A">Team A (Eagles)</option>
                            <option value="B">Team B (Birdies)</option>
                          </select>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Save Current Round Players to Permanent Roster */}
                <div className="p-3 bg-slate-900 rounded-xl border border-slate-800 flex items-center justify-between">
                  <div>
                    <span className="text-xs font-bold text-white block">Save Players to Roster</span>
                    <span className="text-[10px] text-slate-400">Store current golfers permanently for future rounds</span>
                  </div>
                  <button 
                    onClick={handleSaveCurrentPlayersToRoster}
                    className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-emerald-400 active:scale-95 transition"
                  >
                    💾 Save Roster
                  </button>
                </div>

                {/* Saved Rolodex Overview */}
                <div className="p-3 bg-slate-900 rounded-xl border border-slate-800 space-y-2">
                  <span className="text-[11px] font-black uppercase text-emerald-400 tracking-wider">Permanent Golfer Rolodex ({savedRoster.length})</span>
                  <div className="divide-y divide-slate-800">
                    {savedRoster.map(sr => (
                      <div key={sr.id} className="py-1.5 flex items-center justify-between text-xs">
                        <div className="flex items-center gap-2">
                          <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ backgroundColor: sr.color }} />
                          <span className="font-bold text-white">{sr.name}</span>
                          <span className="text-[10px] text-slate-400 font-mono">HCP {sr.hcp}</span>
                        </div>
                        <div className="flex items-center gap-1.5">
                          <button 
                            onClick={() => handleAddPlayerFromSavedRoster(sr)}
                            className="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 text-[10px] font-bold hover:bg-emerald-500/30"
                          >
                            + Add to Round
                          </button>
                          <button 
                            onClick={() => handleDeletePlayerFromRoster(sr.id, sr.name)}
                            className="text-slate-500 hover:text-red-400 p-0.5"
                          >
                            ✕
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 5: SYNC & CLOUD */}
            {activeTab === 'sync' && (
              <div className="flex-1 overflow-y-auto p-3 space-y-3">
                <div className="p-3 bg-slate-900 rounded-xl border border-slate-800 space-y-2">
                  <span className="text-[11px] font-black uppercase text-emerald-400 tracking-wider block">Trip Cloud Hub</span>
                  <input 
                    type="text" 
                    value={tripId} 
                    onChange={(e) => setTripId(e.target.value.replace(/[^a-zA-Z0-9_-]/g, ''))} 
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-mono font-bold text-white outline-none" 
                  />
                  <input 
                    type="text" 
                    placeholder="Google Apps Script URL" 
                    value={sheetsUrl} 
                    onChange={(e) => setSheetsUrl(e.target.value)} 
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-mono text-white outline-none" 
                  />
                  <button 
                    onClick={() => pushToCloud()} 
                    disabled={isSyncing} 
                    className="w-full py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 font-black text-xs text-slate-950 shadow transition"
                  >
                    {isSyncing ? 'Saving to Cloud...' : '☁️ Save to Google Sheets Cloud'}
                  </button>
                </div>
                <div className="p-3 bg-slate-900 rounded-xl border border-slate-800 space-y-2">
                  <button onClick={() => handleGenerateLink('ro')} className="w-full py-2 rounded-lg bg-blue-600 font-bold text-xs text-white">📱 Copy Viewer Link</button>
                  <button onClick={() => handleGenerateLink('rw')} className="w-full py-2 rounded-lg bg-emerald-600 font-black text-xs text-slate-950">✏️ Copy Scorer Link</button>
                </div>
                <div className="p-3 bg-slate-900 rounded-xl border border-slate-800 space-y-2">
                  <span className="text-[11px] font-bold text-slate-300 block">Round Controls</span>
                  <div className="flex gap-2">
                    <button onClick={handleManualReset} className="w-full py-2 rounded-lg bg-red-950/80 hover:bg-red-900 text-red-200 border border-red-800 text-xs font-bold active:scale-95 transition">
                      Reset Active Scores
                    </button>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Bottom App Navigation Bar */}
          <nav className="safe-bottom bg-slate-900 border-t border-slate-800 flex items-center justify-around px-2 shrink-0 z-30 shadow-lg">
            {['live', 'games', 'setup', 'roster', 'sync'].map(tab => (
              <button 
                key={tab} 
                onClick={() => setActiveTab(tab)} 
                className={`flex flex-col items-center flex-1 py-1.5 active:scale-90 transition ${activeTab === tab ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}
              >
                <span className="text-sm">{tab === 'live' ? '⛳' : tab === 'games' ? '🏆' : tab === 'setup' ? '⚙️' : tab === 'roster' ? '👥' : '🔗'}</span>
                <span className="text-[9px] uppercase tracking-wider">{tab === 'live' ? 'Round' : tab === 'games' ? 'Games' : tab === 'setup' ? 'Courses' : tab === 'roster' ? 'Players' : 'Sync'}</span>
              </button>
            ))}
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
