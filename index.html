<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Golf Trip Live Scoring</title>

  <!-- Tailwind CSS, React, and Babel Standalone (Zero-Build CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 overflow-hidden font-sans select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Preset standard courses
    const PRESET_COURSES = {
      pinehurst: {
        name: "Pinehurst No. 2",
        holes: [
          { num: 1, par: 4, hcp: 8, yardage: 404 },
          { num: 2, par: 4, hcp: 4, yardage: 507 },
          { num: 3, par: 4, hcp: 14, yardage: 387 },
          { num: 4, par: 5, hcp: 6, yardage: 569 },
          { num: 5, par: 4, hcp: 2, yardage: 472 },
          { num: 6, par: 3, hcp: 12, yardage: 228 },
          { num: 7, par: 4, hcp: 16, yardage: 424 },
          { num: 8, par: 4, hcp: 10, yardage: 502 },
          { num: 9, par: 3, hcp: 18, yardage: 191 },
          { num: 10, par: 5, hcp: 5, yardage: 617 },
          { num: 11, par: 4, hcp: 7, yardage: 483 },
          { num: 12, par: 4, hcp: 13, yardage: 456 },
          { num: 13, par: 4, hcp: 15, yardage: 382 },
          { num: 14, par: 4, hcp: 3, yardage: 473 },
          { num: 15, par: 3, hcp: 17, yardage: 202 },
          { num: 16, par: 5, hcp: 9, yardage: 534 },
          { num: 17, par: 3, hcp: 11, yardage: 205 },
          { num: 18, par: 4, hcp: 1, yardage: 451 }
        ]
      },
      pebble: {
        name: "Pebble Beach Golf Links",
        holes: [
          { num: 1, par: 4, hcp: 8, yardage: 377 },
          { num: 2, par: 5, hcp: 10, yardage: 502 },
          { num: 3, par: 4, hcp: 12, yardage: 390 },
          { num: 4, par: 4, hcp: 16, yardage: 326 },
          { num: 5, par: 3, hcp: 14, yardage: 192 },
          { num: 6, par: 5, hcp: 2, yardage: 506 },
          { num: 7, par: 3, hcp: 18, yardage: 106 },
          { num: 8, par: 4, hcp: 6, yardage: 427 },
          { num: 9, par: 4, hcp: 4, yardage: 481 },
          { num: 10, par: 4, hcp: 7, yardage: 446 },
          { num: 11, par: 4, hcp: 5, yardage: 373 },
          { num: 12, par: 3, hcp: 17, yardage: 201 },
          { num: 13, par: 4, hcp: 9, yardage: 403 },
          { num: 14, par: 5, hcp: 1, yardage: 572 },
          { num: 15, par: 4, hcp: 13, yardage: 396 },
          { num: 16, par: 4, hcp: 11, yardage: 401 },
          { num: 17, par: 3, hcp: 15, yardage: 178 },
          { num: 18, par: 5, hcp: 3, yardage: 543 }
        ]
      },
      executive9: {
        name: "Cypress Dunes (9-Hole Executive)",
        holes: [
          { num: 1, par: 4, hcp: 3, yardage: 335 },
          { num: 2, par: 3, hcp: 7, yardage: 150 },
          { num: 3, par: 4, hcp: 1, yardage: 385 },
          { num: 4, par: 5, hcp: 5, yardage: 490 },
          { num: 5, par: 3, hcp: 9, yardage: 165 },
          { num: 6, par: 4, hcp: 2, yardage: 360 },
          { num: 7, par: 4, hcp: 6, yardage: 340 },
          { num: 8, par: 3, hcp: 8, yardage: 140 },
          { num: 9, par: 5, hcp: 4, yardage: 510 }
        ]
      }
    };

    const GAME_TYPES = [
      { id: 'best_ball', name: 'Best Ball (Four-Ball)', desc: 'Lowest score among teammates counts as the team score on each hole.' },
      { id: 'scramble', name: 'Scramble', desc: 'All players tee off, best shot chosen, all play from there until holed.' },
      { id: 'vegas', name: 'Vegas (High-Low)', desc: 'Scores of 2 teammates concatenate (e.g. 4 and 5 make 45). Birdie flips opponent’s score high-first!' },
      { id: 'skins', name: 'Skins with Carryovers', desc: 'Lowest unique score wins the skin. Ties carry over to next hole.' },
      { id: 'wolf', name: 'Wolf (Rotating Captain)', desc: 'Player has honor, watches drives, selects partner or goes Lone Wolf.' },
      { id: 'stableford', name: 'Stableford', desc: 'Points awarded per hole: Dbl Bogey=0, Bogey=1, Par=2, Birdie=3, Eagle=4, Albatross=5.' },
      { id: 'nassau', name: 'Nassau (2-2-2)', desc: 'Three separate matches in one: Front 9 winner, Back 9 winner, and Total 18 winner.' },
      { id: 'shamble', name: 'Shamble', desc: 'Best tee shot selected, then all golfers play their own ball into the cup from there.' },
      { id: 'match_play', name: 'Match Play (Team / Pairs)', desc: 'Hole-by-hole competition. Winning a hole earns 1 point. Up/Down/Halved tracker.' },
      { id: 'quota', name: 'Quota (Chicago Points)', desc: 'Points based on score to par against individual target quota (Quota = 36 - Handicap).' }
    ];

    const COLOR_PALETTE = ['#10B981', '#3B82F6', '#F59E0B', '#EC4899', '#8B5CF6', '#14B8A6', '#EF4444', '#06B6D4'];

    function App() {
      const [accessMode, setAccessMode] = useState('rw');
      const [activeTab, setActiveTab] = useState('live'); // 'live' | 'games' | 'setup' | 'roster' | 'sync'
      const [toastMessage, setToastMessage] = useState('');

      const [courseName, setCourseName] = useState('Pinehurst No. 2');
      const [roundDate, setRoundDate] = useState(new Date().toISOString().split('T')[0]);
      const [holesCount, setHolesCount] = useState(18);
      const [holes, setHoles] = useState(PRESET_COURSES.pinehurst.holes);
      
      const [players, setPlayers] = useState([
        { id: 'p1', name: 'Alex M.', hcp: 8, team: 'A', color: '#10B981' },
        { id: 'p2', name: 'Jake T.', hcp: 14, team: 'A', color: '#3B82F6' },
        { id: 'p3', name: 'Ryan C.', hcp: 10, team: 'B', color: '#F59E0B' },
        { id: 'p4', name: 'Dave K.', hcp: 18, team: 'B', color: '#EC4899' },
      ]);

      const [teams, setTeams] = useState([
        { id: 'A', name: 'Team Eagles' },
        { id: 'B', name: 'Team Birdies' }
      ]);

      const [activeGame, setActiveGame] = useState('best_ball');
      const [pointsWager, setPointsWager] = useState(10);

      const [scores, setScores] = useState(() => {
        const initial = {};
        for (let i = 1; i <= 18; i++) initial[i] = { p1: null, p2: null, p3: null, p4: null };
        return initial;
      });

      const [currentHole, setCurrentHole] = useState(1);
      const [selectedPlayerId, setSelectedPlayerId] = useState('p1');
      const [sheetsWebhookUrl, setSheetsWebhookUrl] = useState('');
      const [isSyncing, setIsSyncing] = useState(false);
      const [showOtherModal, setShowOtherModal] = useState(false);
      const [manualScoreInput, setManualScoreInput] = useState('');

      // State restoration (URL hash first, then local storage)
      useEffect(() => {
        const hash = window.location.hash;
        if (hash) {
          try {
            const params = new URLSearchParams(hash.replace(/^#/, ''));
            if (params.get('mode') === 'readonly' || params.get('mode') === 'ro') setAccessMode('ro');
            const stateParam = params.get('state');
            if (stateParam) {
              const parsed = JSON.parse(decodeURIComponent(stateParam));
              if (parsed.c) setCourseName(parsed.c);
              if (parsed.d) setRoundDate(parsed.d);
              if (parsed.h) setHolesCount(parsed.h);
              if (parsed.hl) setHoles(parsed.hl);
              if (parsed.p) setPlayers(parsed.p);
              if (parsed.t) setTeams(parsed.t);
              if (parsed.g) setActiveGame(parsed.g);
              if (parsed.w) setPointsWager(parsed.w);
              if (parsed.s) setScores(parsed.s);
              return;
            }
          } catch (e) {}
        }

        const saved = localStorage.getItem('GOLF_TRIP_STATE_V6');
        if (saved) {
          try {
            const p = JSON.parse(saved);
            if (p.courseName) setCourseName(p.courseName);
            if (p.roundDate) setRoundDate(p.roundDate);
            if (p.holesCount) setHolesCount(p.holesCount);
            if (p.holes) setHoles(p.holes);
            if (p.players) setPlayers(p.players);
            if (p.teams) setTeams(p.teams);
            if (p.activeGame) setActiveGame(p.activeGame);
            if (p.pointsWager) setPointsWager(p.pointsWager);
            if (p.scores) setScores(p.scores);
            if (p.sheetsWebhookUrl) setSheetsWebhookUrl(p.sheetsWebhookUrl);
          } catch (e) {}
        }
      }, []);

      useEffect(() => {
        if (accessMode === 'rw') {
          const stateToSave = { courseName, roundDate, holesCount, holes, players, teams, activeGame, pointsWager, scores, sheetsWebhookUrl };
          localStorage.setItem('GOLF_TRIP_STATE_V6', JSON.stringify(stateToSave));
        }
      }, [accessMode, courseName, roundDate, holesCount, holes, players, teams, activeGame, pointsWager, scores, sheetsWebhookUrl]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      const loadPresetCourse = (presetKey) => {
        if (accessMode === 'ro') return;
        const preset = PRESET_COURSES[presetKey];
        if (preset) {
          setCourseName(preset.name);
          setHoles(preset.holes);
          setHolesCount(preset.holes.length);
          const newScores = {};
          preset.holes.forEach(h => {
            newScores[h.num] = {};
            players.forEach(p => { newScores[h.num][p.id] = null; });
          });
          setScores(newScores);
          showToast(`Loaded ${preset.name}!`);
        }
      };

      const getPlayerHoleStrokes = (playerHcp, holeHcpIndex) => {
        if (!playerHcp || playerHcp <= 0) return 0;
        const baseStrokes = Math.floor(playerHcp / holesCount);
        const remainder = playerHcp % holesCount;
        return baseStrokes + (holeHcpIndex <= remainder ? 1 : 0);
      };

      const currentHoleData = useMemo(() => {
        return holes.find(h => h.num === currentHole) || { num: currentHole, par: 4, hcp: 1, yardage: 400 };
      }, [holes, currentHole]);

      const handleSetScore = (holeNum, playerId, scoreValue) => {
        if (accessMode === 'ro') {
          showToast('Spectator mode: Scoring locked');
          return;
        }
        const val = scoreValue === null || scoreValue === undefined ? null : Number(scoreValue);
        setScores(prev => ({
          ...prev,
          [holeNum]: { ...(prev[holeNum] || {}), [playerId]: val }
        }));
      };

      const advanceToNext = () => {
        const playerIdx = players.findIndex(p => p.id === selectedPlayerId);
        if (playerIdx < players.length - 1) {
          setSelectedPlayerId(players[playerIdx + 1].id);
        } else {
          if (currentHole < holesCount) {
            setCurrentHole(prev => prev + 1);
            setSelectedPlayerId(players[0].id);
          }
        }
      };

      const handleAddPlayer = () => {
        if (accessMode === 'ro') return;
        const newId = `p${Date.now()}`;
        const color = COLOR_PALETTE[players.length % COLOR_PALETTE.length];
        setPlayers(prev => [
          ...prev,
          { id: newId, name: `Player ${prev.length + 1}`, hcp: 10, team: prev.length % 2 === 0 ? 'A' : 'B', color }
        ]);
        showToast('New golfer added!');
      };

      const handleDeletePlayer = (id) => {
        if (accessMode === 'ro') return;
        if (players.length <= 1) {
          showToast('Must keep at least 1 player');
          return;
        }
        setPlayers(prev => prev.filter(p => p.id !== id));
      };

      const handleUpdatePlayer = (id, field, value) => {
        if (accessMode === 'ro') return;
        setPlayers(prev => prev.map(p => p.id === id ? { ...p, [field]: value } : p));
      };

      const handleUpdateHole = (holeNum, field, val) => {
        if (accessMode === 'ro') return;
        setHoles(prev => prev.map(h => h.num === holeNum ? { ...h, [field]: Number(val) || val } : h));
      };

      // Player statistics calculations
      const playerStats = useMemo(() => {
        return players.map(player => {
          let totalGross = 0, totalNet = 0, totalPar = 0, holesPlayed = 0, stablefordPoints = 0;
          holes.slice(0, holesCount).forEach(h => {
            const gross = scores[h.num]?.[player.id];
            if (gross !== null && gross !== undefined && gross > 0) {
              holesPlayed++;
              totalGross += Number(gross);
              totalPar += h.par;
              const strokes = getPlayerHoleStrokes(player.hcp, h.hcp);
              const net = Number(gross) - strokes;
              totalNet += net;

              const netDiff = net - h.par;
              if (netDiff <= -2) stablefordPoints += 4;
              else if (netDiff === -1) stablefordPoints += 3;
              else if (netDiff === 0) stablefordPoints += 2;
              else if (netDiff === 1) stablefordPoints += 1;
            }
          });

          const scoreToPar = totalGross - totalPar;
          const netToPar = totalNet - totalPar;
          const quotaTarget = Math.max(1, 36 - player.hcp);
          const quotaDiff = stablefordPoints - (holesPlayed / holesCount * quotaTarget);

          return {
            ...player,
            holesPlayed,
            totalGross,
            totalNet,
            scoreToPar: holesPlayed > 0 ? (scoreToPar > 0 ? `+${scoreToPar}` : scoreToPar === 0 ? 'E' : `${scoreToPar}`) : '-',
            netToPar: holesPlayed > 0 ? (netToPar > 0 ? `+${netToPar}` : netToPar === 0 ? 'E' : `${netToPar}`) : '-',
            rawNetToPar: netToPar,
            stablefordPoints,
            quotaDiff: quotaDiff.toFixed(1)
          };
        });
      }, [players, holes, holesCount, scores]);

      // Team statistics calculations
      const teamStats = useMemo(() => {
        return teams.map(team => {
          const teamPlayers = playerStats.filter(p => p.team === team.id);
          let teamBestBallNetTotal = 0;
          let holesCompleted = 0;
          holes.slice(0, holesCount).forEach(h => {
            const teamNetScores = teamPlayers.map(p => {
              const raw = scores[h.num]?.[p.id];
              if (!raw) return null;
              return raw - getPlayerHoleStrokes(p.hcp, h.hcp);
            }).filter(s => s !== null);
            if (teamNetScores.length > 0) {
              holesCompleted++;
              teamBestBallNetTotal += Math.min(...teamNetScores);
            }
          });
          return { ...team, bestBallNet: teamBestBallNetTotal, holesCompleted, count: teamPlayers.length };
        });
      }, [teams, playerStats, holes, holesCount, scores]);

      // Tournament games calculations
      const gameCalculations = useMemo(() => {
        const skinsData = [];
        let carryover = 0;
        holes.slice(0, holesCount).forEach(h => {
          const holeScores = players.map(p => {
            const raw = scores[h.num]?.[p.id];
            if (!raw) return null;
            return { player: p, net: raw - getPlayerHoleStrokes(p.hcp, h.hcp) };
          }).filter(Boolean);

          let winner = null;
          let skinValue = 1 + carryover;
          if (holeScores.length === players.length && players.length > 0) {
            const minNet = Math.min(...holeScores.map(s => s.net));
            const playersWithMin = holeScores.filter(s => s.net === minNet);
            if (playersWithMin.length === 1) {
              winner = playersWithMin[0].player;
              carryover = 0;
            } else {
              carryover += 1;
            }
          }
          skinsData.push({ hole: h.num, par: h.par, skinValue, winner, carryover: winner ? 0 : carryover });
        });

        const vegasHoles = [];
        let teamAPoints = 0, teamBPoints = 0;
        holes.slice(0, holesCount).forEach(h => {
          const tA = players.filter(p => p.team === 'A');
          const tB = players.filter(p => p.team === 'B');
          const sA1 = scores[h.num]?.[tA[0]?.id];
          const sA2 = scores[h.num]?.[tA[1]?.id];
          const sB1 = scores[h.num]?.[tB[0]?.id];
          const sB2 = scores[h.num]?.[tB[1]?.id];

          if (sA1 && sA2 && sB1 && sB2) {
            let aLow = Math.min(sA1, sA2), aHigh = Math.max(sA1, sA2);
            let bLow = Math.min(sB1, sB2), bHigh = Math.max(sB1, sB2);
            let valA = parseInt(`${aLow}${aHigh}`, 10);
            let valB = parseInt(`${bLow}${bHigh}`, 10);
            if (aLow < h.par && bLow >= h.par) valB = parseInt(`${bHigh}${bLow}`, 10);
            else if (bLow < h.par && aLow >= h.par) valA = parseInt(`${aHigh}${aLow}`, 10);
            const diff = valB - valA;
            if (diff > 0) teamAPoints += diff;
            else if (diff < 0) teamBPoints += Math.abs(diff);
            vegasHoles.push({ hole: h.num, valA, valB, diff });
          }
        });

        return { skinsData, vegas: { teamAPoints, teamBPoints, vegasHoles } };
      }, [holes, holesCount, players, scores]);

      // Visual Scorecard Glyphs
      const getScoreBadge = (gross, par) => {
        if (!gross) return <span className="text-gray-500 font-mono text-xs">-</span>;
        const diff = Number(gross) - par;
        if (diff <= -2) return <span className="inline-flex items-center justify-center w-7 h-7 rounded-full bg-amber-200 text-amber-950 border-2 border-amber-500 ring-2 ring-amber-400 font-black text-xs">{gross}</span>;
        if (diff === -1) return <span className="inline-flex items-center justify-center w-7 h-7 rounded-full bg-emerald-200 text-emerald-950 border-2 border-emerald-600 font-black text-xs">{gross}</span>;
        if (diff === 0) return <span className="inline-flex items-center justify-center w-7 h-7 text-gray-100 font-bold text-xs">{gross}</span>;
        if (diff === 1) return <span className="inline-flex items-center justify-center w-6 h-6 bg-orange-200 text-orange-950 border-2 border-orange-500 font-black text-xs">{gross}</span>;
        return <span className="inline-flex items-center justify-center w-6 h-6 bg-red-200 text-red-950 border-2 border-red-600 ring-1 ring-red-400 font-black text-xs">{gross}</span>;
      };

      // Push to Google Sheets Webhook
      const handlePushToSheets = async () => {
        if (!sheetsWebhookUrl) {
          showToast('Enter your Google Apps Script URL first');
          return;
        }
        setIsSyncing(true);
        try {
          const payload = {
            timestamp: new Date().toISOString(),
            courseName,
            roundDate,
            players,
            scores,
            holes: holes.slice(0, holesCount)
          };
          await fetch(sheetsWebhookUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          showToast('Scores sent to Google Sheet!');
        } catch (e) {
          showToast('Network error syncing to Google Sheets');
        } finally {
          setIsSyncing(false);
        }
      };

      // CSV Download
      const handleExportCSV = () => {
        let csv = `Course: ${courseName}, Date: ${roundDate}, Holes: ${holesCount}\n\n`;
        csv += `Hole,${holes.slice(0, holesCount).map(h => h.num).join(',')},Total Gross,Total Net,To Par\n`;
        csv += `Par,${holes.slice(0, holesCount).map(h => h.par).join(',')},${holes.slice(0, holesCount).reduce((a,b)=>a+b.par,0)},,\n`;
        csv += `HCP,${holes.slice(0, holesCount).map(h => h.hcp).join(',')},,,\n`;

        playerStats.forEach(p => {
          const rowScores = holes.slice(0, holesCount).map(h => scores[h.num]?.[p.id] || '').join(',');
          csv += `${p.name} (HCP ${p.hcp} | Team ${p.team}),${rowScores},${p.totalGross},${p.totalNet},${p.scoreToPar}\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `GolfTrip_${courseName.replace(/\s+/g, '_')}_${roundDate}.csv`;
        a.click();
        showToast('Scorecard CSV downloaded!');
      };

      // Share Link Generation
      const handleGenerateShareLink = (targetMode) => {
        const compactState = { c: courseName, d: roundDate, h: holesCount, hl: holes, p: players, t: teams, g: activeGame, w: pointsWager, s: scores };
        const encoded = encodeURIComponent(JSON.stringify(compactState));
        const modeParam = targetMode === 'ro' ? 'mode=readonly&' : 'mode=scorer&';
        const shareUrl = `${window.location.origin}${window.location.pathname}#${modeParam}state=${encoded}`;
        
        const temp = document.createElement('input');
        temp.value = shareUrl;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        showToast(targetMode === 'ro' ? 'Spectator (Read-Only) link copied!' : 'Scorer (Read/Write) link copied!');
      };

      const quickScoreButtons = useMemo(() => {
        const par = currentHoleData.par;
        return [
          { label: '🦅 Eagle', diffLabel: `-2 (${par - 2})`, score: par - 2, bg: 'bg-amber-500 hover:bg-amber-600 text-white' },
          { label: '🐦 Birdie', diffLabel: `-1 (${par - 1})`, score: par - 1, bg: 'bg-emerald-600 hover:bg-emerald-700 text-white' },
          { label: '⛳ Par', diffLabel: `E (${par})`, score: par, bg: 'bg-slate-700 hover:bg-slate-800 text-white' },
          { label: '🟧 Bogey', diffLabel: `+1 (${par + 1})`, score: par + 1, bg: 'bg-orange-500 hover:bg-orange-600 text-white' },
          { label: '🟥 Double', diffLabel: `+2 (${par + 2})`, score: par + 2, bg: 'bg-red-500 hover:bg-red-600 text-white' },
          { label: '🟥 Triple', diffLabel: `+3 (${par + 3})`, score: par + 3, bg: 'bg-red-700 hover:bg-red-800 text-white' }
        ];
      }, [currentHoleData]);

      const activePlayer = players.find(p => p.id === selectedPlayerId) || players[0];
      const activePlayerHoleScore = scores[currentHole]?.[activePlayer?.id];
      const activePlayerStrokes = activePlayer ? getPlayerHoleStrokes(activePlayer.hcp, currentHoleData.hcp) : 0;
      const isHigherThanTriple = activePlayerHoleScore && activePlayerHoleScore > currentHoleData.par + 3;

      return (
        <div className="flex flex-col h-screen w-full bg-slate-950 text-slate-100 font-sans overflow-hidden select-none">
          
          {/* Top Bar */}
          <header className="flex items-center justify-between px-3 py-2 bg-slate-900 border-b border-slate-800 shrink-0 z-20">
            <div className="flex items-center space-x-2">
              <div className="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center font-black text-white shadow-md">⛳</div>
              <div>
                <div className="flex items-center gap-1.5">
                  <h1 className="text-sm font-black text-white truncate max-w-[140px] sm:max-w-[200px]">{courseName}</h1>

                        <div className="flex items-center gap-1">
                          <span className="text-xs text-slate-400">Team:</span>
                          <select disabled={accessMode === 'ro'} value={player.team} onChange={e => handleUpdatePlayer(player.id, 'team', e.target.value)} className="bg-slate-800 border border-slate-700 rounded-xl px-2 py-1 text-xs font-bold text-emerald-400 outline-none">
                            <option value="A">Team A (Eagles)</option>
                            <option value="B">Team B (Birdies)</option>
                          </select>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="p-4 bg-slate-900 rounded-2xl border border-slate-800 space-y-2">
                  <span className="text-xs font-bold text-slate-400 uppercase">Wager / Point Stake</span>
                  <div className="flex items-center gap-2">
                    <span className="text-emerald-400 font-bold">$</span>
                    <input type="number" disabled={accessMode === 'ro'} value={pointsWager} onChange={e => setPointsWager(Number(e.target.value))} className="w-24 bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 font-mono text-sm text-white" />
                    <span className="text-xs text-slate-400">per point or skin</span>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 5: SYNC & GOOGLE SHEETS */}
            {activeTab === 'sync' && (
              <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-950">
                <h2 className="text-lg font-black text-white">Cloud Sync & Export</h2>

                <div className="p-4 bg-slate-900 rounded-2xl border border-slate-800 space-y-3">
                  <span className="text-xs font-bold text-slate-300 block">Live Share Links</span>
                  <button onClick={() => handleGenerateShareLink('ro')} className="w-full py-2.5 rounded-xl bg-blue-600 font-bold text-xs text-white">Copy Spectator Link (Read Only)</button>
                  <button onClick={() => handleGenerateShareLink('rw')} className="w-full py-2.5 rounded-xl bg-emerald-600 font-black text-xs text-slate-950">Copy Scorer Link (Read / Write)</button>
                </div>

                <div className="p-4 bg-slate-900 rounded-2xl border border-slate-800 space-y-3">
                  <span className="text-xs font-bold text-white block">Google Sheets Webhook Sync</span>
                  <input type="text" placeholder="https://script.google.com/macros/s/.../exec" value={sheetsWebhookUrl} onChange={e => setSheetsWebhookUrl(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs font-mono text-white outline-none" />
                  <button onClick={handlePushToSheets} disabled={isSyncing} className="w-full py-2.5 rounded-xl bg-blue-600 font-bold text-xs text-white shadow">
                    {isSyncing ? 'Syncing...' : 'Push Scores to Google Sheet Now'}
                  </button>
                </div>

                <div className="p-4 bg-slate-900 rounded-2xl border border-slate-800 space-y-2">
                  <span className="text-xs font-bold text-slate-300 block">Backup & Reset</span>
                  <div className="flex gap-2">
                    <button onClick={handleExportCSV} className="flex-1 py-2 rounded-xl bg-slate-800 text-xs font-bold border border-slate-700">Download CSV</button>
                    {accessMode === 'rw' && (
                      <button onClick={() => { setScores({}); showToast('Round cleared'); }} className="px-4 py-2 rounded-xl bg-red-950 text-red-300 text-xs font-bold border border-red-800">Clear Scores</button>
                    )}
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Bottom Navigation */}
          <nav className="h-14 bg-slate-900 border-t border-slate-800 flex items-center justify-around px-2 shrink-0 z-30">
            <button onClick={() => setActiveTab('live')} className={`flex flex-col items-center flex-1 py-1 ${activeTab === 'live' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}>
              <span className="text-sm">⛳</span>
              <span className="text-[10px]">Round</span>
            </button>
            <button onClick={() => setActiveTab('games')} className={`flex flex-col items-center flex-1 py-1 ${activeTab === 'games' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}>
              <span className="text-sm">🏆</span>
              <span className="text-[10px]">Games</span>
            </button>
            <button onClick={() => setActiveTab('setup')} className={`flex flex-col items-center flex-1 py-1 ${activeTab === 'setup' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}>
              <span className="text-sm">⚙️</span>
              <span className="text-[10px]">Course</span>
            </button>
            <button onClick={() => setActiveTab('roster')} className={`flex flex-col items-center flex-1 py-1 ${activeTab === 'roster' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}>
              <span className="text-sm">👥</span>
              <span className="text-[10px]">Players</span>
            </button>
            <button onClick={() => setActiveTab('sync')} className={`flex flex-col items-center flex-1 py-1 ${activeTab === 'sync' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}>
              <span className="text-sm">🔗</span>
              <span className="text-[10px]">Sync</span>
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
